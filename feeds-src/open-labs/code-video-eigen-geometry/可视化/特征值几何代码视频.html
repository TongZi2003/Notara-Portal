<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码微课 · 特征值几何拉伸与非对称正定陷阱</title>
<style>
  :root {
    --cv-bg: var(--pa-bg-surface, #fdfbf7);
    --cv-subtle: var(--pa-bg-subtle, #f7f3ea);
    --cv-ink: var(--pa-ink, #2c2722);
    --cv-ink-2: var(--pa-ink-secondary, #6c6358);
    --cv-ink-3: var(--pa-ink-muted, #968c80);
    --cv-border: var(--pa-border, rgba(82, 72, 60, 0.14));
    --cv-border-strong: var(--pa-border-strong, rgba(82, 72, 60, 0.24));
    --cv-accent: var(--pa-accent, #7d5c46);
    --cv-terracotta: #b4532a;
    --cv-indigo: #3f536e;
    --cv-font: var(--pa-font-sans, "PingFang SC", "Noto Serif SC", Georgia, serif);
    --cv-mono: var(--pa-font-mono, "SF Mono", ui-monospace, monospace);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 14px 16px;
    background: var(--cv-bg);
    color: var(--cv-ink);
    font-family: var(--cv-font);
    font-size: 13px;
    line-height: 1.55;
  }
  .cv-shell {
    max-width: 820px;
    margin: 0 auto;
    border: 1px solid var(--cv-border-strong);
    border-radius: 12px;
    background: var(--cv-bg);
    overflow: hidden;
  }
  .cv-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--cv-subtle);
    border-bottom: 1px solid var(--cv-border);
  }
  .cv-title-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cv-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(125, 92, 70, 0.12);
    color: var(--cv-accent);
  }
  .cv-badge--live { background: rgba(180, 83, 42, 0.13); color: var(--cv-terracotta); }
  .cv-title { margin: 0; font-size: 14px; font-weight: 600; color: var(--cv-ink); }
  .cv-meta { font-size: 11.5px; color: var(--cv-ink-3); font-family: var(--cv-mono); }
  .cv-stage-wrap { position: relative; background: #fcfaf4; border-bottom: 1px solid var(--cv-border); }
  canvas { display: block; width: 100%; height: 310px; }
  .cv-hud {
    position: absolute;
    top: 12px;
    right: 12px;
    min-width: 205px;
    padding: 8px 11px;
    border-radius: 9px;
    background: rgba(253, 251, 247, 0.93);
    border: 1px solid var(--cv-border-strong);
    font-family: var(--cv-mono);
    font-size: 11.5px;
  }
  .cv-hud-row { display: flex; justify-content: space-between; gap: 10px; padding: 1.5px 0; }
  .cv-hud-label { color: var(--cv-ink-2); font-family: var(--cv-font); }
  .cv-subtitle-bar {
    padding: 10px 14px;
    background: var(--cv-subtle);
    border-bottom: 1px solid var(--cv-border);
    min-height: 54px;
    display: flex;
    align-items: center;
  }
  .cv-subtitle-text { margin: 0; font-size: 13px; color: var(--cv-ink); line-height: 1.58; }
  .cv-subtitle-scene { display: inline-block; margin-right: 6px; font-weight: 600; color: var(--cv-accent); }
  .cv-transport { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--cv-border); }
  .cv-transport-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cv-play-btn {
    border: 1px solid var(--cv-ink);
    background: var(--cv-ink);
    color: #fdfbf7;
    border-radius: 7px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    min-width: 112px;
  }
  .cv-time { font-family: var(--cv-mono); font-size: 11.5px; color: var(--cv-ink-2); min-width: 88px; }
  .cv-timeline { flex: 1 1 200px; accent-color: var(--cv-accent); cursor: pointer; }
  .cv-speed-group { display: inline-flex; gap: 4px; }
  .cv-pill {
    border: 1px solid var(--cv-border-strong);
    background: var(--cv-bg);
    color: var(--cv-ink-2);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .cv-pill[aria-pressed="true"] {
    background: var(--cv-accent);
    border-color: var(--cv-accent);
    color: #fdfbf7;
    font-weight: 600;
  }
  .cv-chapters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .cv-chapter-btn {
    text-align: left;
    border: 1px solid var(--cv-border);
    background: var(--cv-subtle);
    color: var(--cv-ink-2);
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 11.5px;
    cursor: pointer;
    line-height: 1.35;
  }
  .cv-chapter-btn strong { display: block; color: var(--cv-ink); font-size: 11.5px; margin-bottom: 1px; }
  .cv-chapter-btn[aria-current="step"] { border-color: var(--cv-accent); background: rgba(125, 92, 70, 0.11); }
  .cv-interact {
    padding: 10px 14px 12px;
    background: var(--cv-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .cv-interact-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cv-slider-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--cv-ink-2); }
  .cv-slider-wrap input { width: 130px; accent-color: var(--cv-terracotta); }
  .cv-quote-btn {
    border: 1px solid var(--cv-accent);
    background: rgba(125, 92, 70, 0.08);
    color: var(--cv-accent);
    border-radius: 7px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .cv-quote-btn:hover { background: var(--cv-accent); color: #fdfbf7; }
  .cv-toast { width: 100%; font-size: 11.5px; color: var(--cv-accent); min-height: 16px; }
  @media (max-width: 640px) {
    .cv-chapters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cv-hud { position: static; margin: 8px 12px; }
    canvas { height: 250px; }
  }
</style>
</head>
<body>
<div class="cv-shell">
  <header class="cv-head">
    <div class="cv-title-group">
      <span class="cv-badge" id="mode-badge">矢量代码视频 · 60fps</span>
      <h1 class="cv-title">特征值几何拉伸与非对称正定陷阱</h1>
    </div>
    <span class="cv-meta">19 KB 脚本 · 随时暂停转向量</span>
  </header>

  <div class="cv-stage-wrap">
    <canvas id="stage" aria-label="矩阵特征向量与二次型几何矢量动画"></canvas>
    <div class="cv-hud">
      <div class="cv-hud-row"><span class="cv-hud-label">当前矩阵</span><strong id="hud-mat">S = [[2,1],[1,2]]</strong></div>
      <div class="cv-hud-row"><span class="cv-hud-label">向量角度 θ</span><strong id="hud-ang">45°</strong></div>
      <div class="cv-hud-row"><span class="cv-hud-label">夹角 ∠(v, Av)</span><strong id="hud-gap">0.0°</strong></div>
      <div class="cv-hud-row"><span class="cv-hud-label">二次型 vᵀAv</span><strong id="hud-quad">3.00</strong></div>
      <div class="cv-hud-row"><span class="cv-hud-label">矩阵特征值</span><span id="hud-eig">3, 1</span></div>
      <div class="cv-hud-row"><span class="cv-hud-label">对称部分特征值</span><strong id="hud-sym">3, 1（正定）</strong></div>
    </div>
  </div>

  <div class="cv-subtitle-bar">
    <p class="cv-subtitle-text" id="subtitle"></p>
  </div>

  <div class="cv-transport">
    <div class="cv-transport-row">
      <button type="button" class="cv-play-btn" id="play-btn">▶ 播放代码视频</button>
      <span class="cv-time" id="time-readout">00:00 / 00:48</span>
      <input type="range" id="timeline" class="cv-timeline" min="0" max="48" step="0.05" value="0" aria-label="代码视频时间轴">
      <div class="cv-speed-group" role="group" aria-label="播放倍速">
        <button type="button" class="cv-pill" data-speed="0.75" aria-pressed="false">0.75×</button>
        <button type="button" class="cv-pill" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" class="cv-pill" data-speed="1.5" aria-pressed="false">1.5×</button>
      </div>
    </div>

    <div class="cv-chapters" role="group" aria-label="分幕跳转">
      <button type="button" class="cv-chapter-btn" data-jump="0" aria-current="step">
        <strong>01 · 圆变椭圆</strong>观察像向量偏转
      </button>
      <button type="button" class="cv-chapter-btn" data-jump="12">
        <strong>02 · 锁定特征轴</strong>45° 与 135° 共线
      </button>
      <button type="button" class="cv-chapter-btn" data-jump="24">
        <strong>03 · 正交正定</strong>vᵀSv 恒落 [1,3]
      </button>
      <button type="button" class="cv-chapter-btn" data-jump="36">
        <strong>04 · 非对称陷阱</strong>全正特征值却变负
      </button>
    </div>
  </div>

  <div class="cv-interact">
    <div class="cv-interact-left">
      <div class="cv-speed-group" role="group" aria-label="切换实验矩阵">
        <button type="button" class="cv-pill" data-mat="sym" aria-pressed="true">实对称 S=[[2,1],[1,2]]</button>
        <button type="button" class="cv-pill" data-mat="asym" aria-pressed="false">非对称 C=[[1,4],[0,1]]</button>
      </div>
      <label class="cv-slider-wrap">
        <span>拖动角度 θ：</span>
        <input type="range" id="ang-slider" data-param="thetaDeg" min="-180" max="180" step="1" value="45">
      </label>
    </div>
    <button type="button" class="cv-quote-btn" id="quote-btn">把当前帧带给 AI 老师 ↗</button>
    <div class="cv-toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  var TOTAL = 48;
  var playing = false;
  var interactiveOverride = false;
  var speed = 1;
  var t = 15.0; // Start right on the dramatic 45° eigenvector alignment frame
  var manualMat = 'sym';
  var manualDeg = 45;
  var lastTs = 0;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var playBtn = document.getElementById('play-btn');
  var timeEl = document.getElementById('time-readout');
  var timeline = document.getElementById('timeline');
  var subtitleEl = document.getElementById('subtitle');
  var badgeEl = document.getElementById('mode-badge');
  var angSlider = document.getElementById('ang-slider');
  var toastEl = document.getElementById('toast');

  var hudMat = document.getElementById('hud-mat');
  var hudAng = document.getElementById('hud-ang');
  var hudGap = document.getElementById('hud-gap');
  var hudQuad = document.getElementById('hud-quad');
  var hudEig = document.getElementById('hud-eig');
  var hudSym = document.getElementById('hud-sym');

  var speedBtns = Array.prototype.slice.call(document.querySelectorAll('[data-speed]'));
  var matBtns = Array.prototype.slice.call(document.querySelectorAll('[data-mat]'));
  var chapterBtns = Array.prototype.slice.call(document.querySelectorAll('[data-jump]'));

  var MATS = {
    sym: {
      label: 'S = [[2,1],[1,2]]',
      m: [[2, 1], [1, 2]],
      eigText: 'λ = 3, 1',
      symText: '3, 1（正定）',
      axesDeg: [45, 135],
      scale: 40
    },
    asym: {
      label: 'C = [[1,4],[0,1]]',
      m: [[1, 4], [0, 1]],
      eigText: 'λ = 1, 1（全正！）',
      symText: '3, -1（不定！）',
      axesDeg: [0],
      scale: 30
    }
  };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeInOut(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function formatTime(sec) {
    var s = Math.max(0, Math.floor(sec));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function applyM(m, vx, vy) {
    return [m[0][0] * vx + m[0][1] * vy, m[1][0] * vx + m[1][1] * vy];
  }

  function computeState() {
    var sceneIdx = t < 12 ? 0 : t < 24 ? 1 : t < 36 ? 2 : 3;
    var matKey = manualMat;
    var deg = manualDeg;
    var captionTitle = '';
    var captionBody = '';

    if (!interactiveOverride) {
      if (sceneIdx === 0) {
        matKey = 'sym';
        deg = 10 + 170 * easeInOut(clamp(t / 12, 0, 1));
        captionTitle = '第 1 幕 · 矩阵把单位圆压成椭圆：';
        captionBody = '浅色圆是全部单位输入向量 v，深色椭圆是变换后的 Av。绝大多数方向都会被矩阵拧偏，Av 与 v 不共线。';
      } else if (sceneIdx === 1) {
        matKey = 'sym';
        var p1 = clamp((t - 12) / 12, 0, 1);
        deg = p1 < 0.5 ? 45 : 45 + 90 * easeInOut((p1 - 0.5) * 2);
        captionTitle = '第 2 幕 · 捕捉方向不变的特征轴：';
        captionBody = '当 θ=45° 时 Av=3v（零偏转拉伸 3 倍）；转到 θ=135° 时 Av=1v。这两条虚线就是实对称矩阵互相垂直的特征轴。';
      } else if (sceneIdx === 2) {
        matKey = 'sym';
        deg = 135 - 180 * easeInOut(clamp((t - 24) / 12, 0, 1));
        captionTitle = '第 3 幕 · 实对称矩阵的瑞利商护城河：';
        captionBody = '看右上角二次型 vᵀSv：由于特征轴正交，无论怎么旋转单位向量，vᵀSv 始终夹在最小与最大特征值 [1, 3] 之间，严格正定。';
      } else {
        matKey = 'asym';
        var p3 = clamp((t - 36) / 12, 0, 1);
        deg = 25 - 70 * easeInOut(p3); // sweeps smoothly straight to -45° where vᵀCv = -1 < 0!
        captionTitle = '第 4 幕 · 非对称上三角陷阱：';
        captionBody = 'C=[[1,4],[0,1]] 特征值全是 +1，但转到 θ=-45°（即 (1,-1) 方向）时，Av 与 v 夹钝角，二次型 vᵀCv 骤跌成 -1.00 < 0！对称部分特征值为 3 和 -1。';
      }
      manualMat = matKey;
      manualDeg = deg;
    } else {
      captionTitle = '交互暂停态（' + formatTime(t) + '）：';
      captionBody = matKey === 'asym'
        ? '正在检视非对称矩阵 C=[[1,4],[0,1]]：把 θ 拖到 -45°，亲眼验证虽然 C 的特征值全为 +1，但二次型 vᵀCv 仍取负值 -1.00。'
        : '正在检视实对称矩阵 S=[[2,1],[1,2]]：把 θ 分别拖到 45° 和 135°，观察 ∠(v, Av) 归零的瞬间。';
    }

    var cfg = MATS[matKey];
    var rad = (deg * Math.PI) / 180;
    var vx = Math.cos(rad);
    var vy = Math.sin(rad);
    var av = applyM(cfg.m, vx, vy);
    var quad = vx * av[0] + vy * av[1];
    var avLen = Math.hypot(av[0], av[1]) || 1;
    var cosGap = clamp(quad / avLen, -1, 1);
    var gapDeg = (Math.acos(cosGap) * 180) / Math.PI;
    var aligned = Math.min(gapDeg, Math.abs(180 - gapDeg)) < 2.2;

    return {
      sceneIdx: sceneIdx,
      matKey: matKey,
      cfg: cfg,
      deg: deg,
      vx: vx, vy: vy,
      avx: av[0], avy: av[1],
      quad: quad,
      gapDeg: gapDeg,
      aligned: aligned,
      captionTitle: captionTitle,
      captionBody: captionBody
    };
  }

  function drawArrow(x0, y0, x1, y1, color, width) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    var ang = Math.atan2(y1 - y0, x1 - x0);
    var head = 9;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - head * Math.cos(ang - 0.38), y1 - head * Math.sin(ang - 0.38));
    ctx.lineTo(x1 - head * Math.cos(ang + 0.38), y1 - head * Math.sin(ang + 0.38));
    ctx.closePath();
    ctx.fill();
  }

  function render() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var W = Math.max(300, Math.round(rect.width));
    var H = Math.max(220, Math.round(rect.height));
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var st = computeState();
    var cfg = st.cfg;
    var cx = W * 0.40;
    var cy = H * 0.52;
    var sc = cfg.scale;

    function mx(x) { return cx + x * sc; }
    function my(y) { return cy - y * sc; }

    ctx.fillStyle = '#fcfaf4';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid
    ctx.strokeStyle = 'rgba(125, 92, 70, 0.08)';
    ctx.lineWidth = 1;
    for (var g = -6; g <= 6; g++) {
      ctx.beginPath(); ctx.moveTo(mx(g), 0); ctx.lineTo(mx(g), H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, my(g)); ctx.lineTo(W, my(g)); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = '#bfb5a6';
    ctx.lineWidth = 1.25;
    ctx.beginPath(); ctx.moveTo(16, cy); ctx.lineTo(W - 16, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 12); ctx.lineTo(cx, H - 12); ctx.stroke();

    // Eigen axes (dashed walnut)
    ctx.strokeStyle = 'rgba(125, 92, 70, 0.45)';
    ctx.lineWidth = 1.3;
    ctx.setLineDash([5, 4]);
    for (var a = 0; a < cfg.axesDeg.length; a++) {
      var ar = (cfg.axesDeg[a] * Math.PI) / 180;
      ctx.beginPath();
      ctx.moveTo(mx(-4.5 * Math.cos(ar)), my(-4.5 * Math.sin(ar)));
      ctx.lineTo(mx(4.5 * Math.cos(ar)), my(4.5 * Math.sin(ar)));
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Negative quadratic-form sector shading for non-symmetric C (zero green: slate indigo)
    if (st.matKey === 'asym') {
      ctx.fillStyle = 'rgba(63, 83, 110, 0.12)';
      for (var d = -180; d < 180; d += 3) {
        var r0 = (d * Math.PI) / 180;
        var r1 = ((d + 3) * Math.PI) / 180;
        var qm = Math.cos(r0) * (Math.cos(r0) + 4 * Math.sin(r0)) + Math.sin(r0) * Math.sin(r0);
        if (qm < 0) {
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, sc * 2.1, -r1, -r0);
          ctx.closePath();
          ctx.fill();
        }
      }
      ctx.font = '600 11px "PingFang SC", sans-serif';
      ctx.fillStyle = '#3f536e';
      ctx.fillText('vᵀCv < 0 负值扇区', mx(1.35), my(-1.75));
    }

    // Unit circle
    ctx.strokeStyle = '#9c9284';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.arc(cx, cy, sc, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Transformed ellipse { Av : ||v||=1 }
    ctx.strokeStyle = '#7d5c46';
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    for (var i = 0; i <= 140; i++) {
      var th = (i / 140) * Math.PI * 2;
      var pt = applyM(cfg.m, Math.cos(th), Math.sin(th));
      if (i === 0) ctx.moveTo(mx(pt[0]), my(pt[1]));
      else ctx.lineTo(mx(pt[0]), my(pt[1]));
    }
    ctx.closePath();
    ctx.stroke();

    // Vectors v and Av
    drawArrow(cx, cy, mx(st.avx), my(st.avy), st.quad < 0 ? '#3f536e' : '#b4532a', 2.6);
    drawArrow(cx, cy, mx(st.vx), my(st.vy), '#2c2722', 2.2);

    ctx.font = '600 11.5px "SF Mono", ui-monospace, monospace';
    ctx.fillStyle = '#2c2722';
    ctx.fillText('v', mx(st.vx) + 7, my(st.vy) - 5);
    ctx.fillStyle = st.quad < 0 ? '#3f536e' : '#b4532a';
    ctx.fillText(st.aligned ? 'Av（共线特征向量！）' : 'Av', mx(st.avx) + 8, my(st.avy) - 6);

    // Update HUD
    hudMat.textContent = cfg.label;
    hudAng.textContent = Math.round(st.deg) + '°';
    hudGap.textContent = st.gapDeg.toFixed(1) + '°' + (st.aligned ? '（共线）' : '');
    hudQuad.textContent = st.quad.toFixed(2) + (st.quad < 0 ? '（负！）' : '');
    hudQuad.style.color = st.quad < 0 ? '#3f536e' : '#2c2722';
    hudEig.textContent = cfg.eigText;
    hudSym.textContent = cfg.symText;

    subtitleEl.innerHTML = '<span class="cv-subtitle-scene">' + st.captionTitle + '</span>' + st.captionBody;
    timeEl.textContent = formatTime(t) + ' / ' + formatTime(TOTAL);
    timeline.value = t.toFixed(2);
    angSlider.value = String(Math.round(clamp(st.deg, -180, 180)));

    badgeEl.textContent = interactiveOverride
      ? '交互暂停态 · 已接管向量角度'
      : playing
        ? '播放中 · 60fps 矢量代码视频'
        : '矢量代码视频 · 60fps';
    badgeEl.className = interactiveOverride ? 'cv-badge cv-badge--live' : 'cv-badge';
    playBtn.textContent = playing ? '❚❚ 暂停并动手改' : '▶ 播放代码视频';

    for (var mIdx = 0; mIdx < matBtns.length; mIdx++) {
      matBtns[mIdx].setAttribute('aria-pressed', matBtns[mIdx].dataset.mat === st.matKey ? 'true' : 'false');
    }
    for (var cIdx = 0; cIdx < chapterBtns.length; cIdx++) {
      if (cIdx === st.sceneIdx) chapterBtns[cIdx].setAttribute('aria-current', 'step');
      else chapterBtns[cIdx].removeAttribute('aria-current');
    }

    if (window.notara && typeof window.notara.setState === 'function') {
      window.notara.setState({
        summary: '代码视频《特征值几何拉伸与非对称正定陷阱》停在 ' + formatTime(t) + '（' + cfg.label + '，θ=' + Math.round(st.deg) + '°，vᵀAv=' + st.quad.toFixed(2) + '）。',
        params: { timestamp: formatTime(t), matrix: cfg.label, thetaDeg: Math.round(st.deg), quadraticForm: Number(st.quad.toFixed(2)), angleGapDeg: Number(st.gapDeg.toFixed(1)) }
      });
    }
  }

  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.08, (ts - lastTs) / 1000) * speed;
    lastTs = ts;
    t += dt;
    if (t >= TOTAL) { t = TOTAL; playing = false; }
    render();
    if (playing) requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', function () {
    if (playing) {
      playing = false;
      interactiveOverride = true;
      render();
    } else {
      if (t >= TOTAL - 0.1) t = 0;
      interactiveOverride = false;
      playing = true;
      lastTs = 0;
      render();
      requestAnimationFrame(tick);
    }
  });

  timeline.addEventListener('input', function () {
    t = Number(timeline.value) || 0;
    interactiveOverride = false;
    render();
  });

  speedBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      speed = Number(btn.dataset.speed) || 1;
      speedBtns.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
    });
  });

  chapterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      t = Number(btn.dataset.jump) || 0;
      interactiveOverride = false;
      render();
    });
  });

  matBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      playing = false;
      interactiveOverride = true;
      manualMat = btn.dataset.mat || 'sym';
      if (manualMat === 'asym') manualDeg = -45;
      render();
    });
  });

  angSlider.addEventListener('input', function () {
    playing = false;
    interactiveOverride = true;
    manualDeg = Number(angSlider.value) || 0;
    render();
  });

  document.getElementById('quote-btn').addEventListener('click', function () {
    playing = false;
    var st = computeState();
    var msg = '我在代码视频《特征值几何拉伸与非对称正定陷阱》第 ' + formatTime(t) + ' 暂停了（' + st.cfg.label + '，θ=' + Math.round(st.deg) + '°，夹角 ' + st.gapDeg.toFixed(1) + '°，vᵀAv=' + st.quad.toFixed(2) + '），请结合这一帧帮我核对直觉。';
    if (window.notara && typeof window.notara.quoteState === 'function') {
      window.notara.quoteState({
        summary: msg,
        params: { timestamp: formatTime(t), matrix: st.cfg.label, thetaDeg: Math.round(st.deg), quadraticForm: Number(st.quad.toFixed(2)) }
      });
      toastEl.textContent = '已将当前帧状态（' + st.cfg.label + ', θ=' + Math.round(st.deg) + '°）带入书房课堂草稿。';
    } else {
      toastEl.textContent = '当前帧上下文已生成：' + msg;
    }
    render();
  });

  window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
