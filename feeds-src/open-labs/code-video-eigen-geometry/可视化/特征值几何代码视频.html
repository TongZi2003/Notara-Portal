<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特征值几何与非对称正定陷阱 · 代码微课</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f6f1e6;
    color: #2c2722;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", Georgia, "Times New Roman", serif;
  }
  .mono {
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  math {
    font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", "Times New Roman", "Songti SC", serif;
    font-size: 1.04em;
    color: inherit;
  }
  math[display="inline"] { vertical-align: middle; }

  .sheet { width: 100%; background: #f6f1e6; color: #2c2722; overflow: hidden; }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 20px;
    background: #f9f5ec;
    border-bottom: 2px double rgba(92, 76, 58, 0.24);
  }
  .sheet-title { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: 0.02em; color: #26211c; }
  .sheet-live { font-size: 13px; color: #6b5f52; white-space: nowrap; }
  .sheet-live strong { color: #a83825; font-weight: 600; }

  .sheet-grid { display: grid; grid-template-columns: 1.38fr 1fr; min-height: 368px; }
  .sheet-left {
    padding: 12px 18px 14px;
    background: #faf6ee;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  canvas { display: block; width: 100%; height: 300px; }
  .sheet-note {
    margin-top: 8px;
    padding-top: 9px;
    border-top: 1px dashed rgba(92, 76, 58, 0.20);
    font-size: 13px;
    line-height: 1.72;
    color: #3a332c;
  }
  .sheet-note-tag { color: #a83825; font-weight: 600; margin-right: 4px; }

  .sheet-right {
    position: relative;
    border-left: 2px double rgba(92, 76, 58, 0.22);
    padding: 14px 18px 13px;
    background: #f5efe2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sol-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 7px;
    margin-bottom: 9px;
    border-bottom: 1px solid rgba(92, 76, 58, 0.14);
  }
  .sol-head h2 { margin: 0; font-size: 13.5px; font-weight: 700; color: #2b251f; }
  .sol-total { font-size: 12px; color: #7c6f60; }

  .sol-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .sol-step {
    padding: 6px 8px 6px 11px;
    border-left: 2px solid transparent;
    border-radius: 0 4px 4px 0;
    opacity: 0.52;
    cursor: pointer;
    transition: opacity 150ms ease, border-color 150ms ease, background 150ms ease;
  }
  .sol-step:hover { opacity: 0.85; }
  .sol-step[data-active="true"] {
    opacity: 1;
    border-left-color: #a83825;
    background: rgba(168, 56, 37, 0.05);
  }
  .sol-step-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 12px;
    color: #6f6254;
    margin-bottom: 3px;
  }
  .sol-step[data-active="true"] .sol-step-top { color: #2b251f; font-weight: 600; }
  .sol-eq { font-size: 13px; color: #25201b; line-height: 1.65; }

  .bet-box {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 46px;
    z-index: 4;
    padding: 11px 12px;
    background: #fbf7ef;
    border: 1px dashed rgba(168, 56, 37, 0.52);
    border-radius: 5px;
    box-shadow: 0 10px 26px rgba(44, 39, 34, 0.14);
  }
  .bet-box[hidden] { display: none; }
  .bet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: #a83825;
    margin-bottom: 6px;
  }
  .bet-skip { appearance: none; border: none; background: none; color: #7c6f60; font-size: 11.5px; cursor: pointer; padding: 0; }
  .bet-choice {
    display: block;
    width: 100%;
    text-align: left;
    appearance: none;
    background: transparent;
    border: 1px solid rgba(92, 76, 58, 0.22);
    border-radius: 3px;
    padding: 6px 8px;
    margin-top: 5px;
    font-size: 12px;
    color: #2b251f;
    cursor: pointer;
  }
  .bet-choice:hover { border-color: #a83825; background: rgba(168, 56, 37, 0.045); }
  .bet-fb { margin-top: 7px; font-size: 12px; line-height: 1.6; color: #a83825; }
  .bet-fb[hidden] { display: none; }

  .right-actions {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(92, 76, 58, 0.14);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .text-link {
    appearance: none;
    border: none;
    background: none;
    padding: 2px 0;
    font: 500 12px/1.2 inherit;
    color: #7c6f60;
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .text-link:hover { color: #26211c; border-bottom-color: rgba(44, 39, 34, 0.35); }
  .red-btn {
    appearance: none;
    border: 1px solid rgba(168, 56, 37, 0.45);
    background: transparent;
    color: #a83825;
    padding: 4px 10px;
    border-radius: 3px;
    font: 500 12px/1.2 inherit;
    cursor: pointer;
  }
  .red-btn:hover { background: rgba(168, 56, 37, 0.06); }
  .toast { font-size: 11.5px; color: #7c6f60; }

  .sheet-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 20px;
    background: #f9f5ec;
    border-top: 1px solid rgba(92, 76, 58, 0.16);
    font-size: 12px;
  }
  .foot-transport { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 220px; }
  .play-btn {
    appearance: none;
    border: 1px solid rgba(92, 76, 58, 0.34);
    background: #3d352d;
    color: #faf6ee;
    padding: 5px 12px;
    border-radius: 3px;
    font: 500 12px/1.2 inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .hairline-range {
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: rgba(92, 76, 58, 0.24);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }
  .hairline-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #a83825;
    cursor: pointer;
  }
  #timeline { flex: 1; }
  .clock { font-size: 11.5px; color: #7c6f60; white-space: nowrap; }
  .foot-params { display: flex; align-items: center; gap: 12px; color: #6b5f52; }
  .fn-tabs { display: inline-flex; align-items: center; gap: 10px; }
  .fn-tab {
    appearance: none;
    border: none;
    background: none;
    padding: 1px 0;
    font-size: 12.5px;
    color: #7c6f60;
    cursor: pointer;
    border-bottom: 1.5px solid transparent;
  }
  .fn-tab[aria-pressed="true"] { color: #a83825; border-bottom-color: #a83825; }
  .param-pair { display: inline-flex; align-items: center; gap: 6px; }
  .param-pair input[type="range"] { width: 78px; }
  .param-pair input[type="range"]::-webkit-slider-thumb { background: #7d5c46; }

  @media (max-width: 700px) {
    .sheet-head { padding: 9px 14px; }
    .sheet-title { font-size: 14px; }
    .sheet-live { font-size: 12px; }
    .sheet-grid { grid-template-columns: 1.04fr 1fr; min-height: 318px; }
    .sheet-left { padding: 10px 12px 11px; }
    canvas { height: 244px; }
    .sheet-note { font-size: 12px; line-height: 1.62; padding-top: 7px; }
    .sheet-right { padding: 11px 13px 10px; }
    .sol-steps { gap: 5px; }
    .sol-step { padding: 4px 6px 4px 9px; }
    .sol-step-top { font-size: 11.5px; margin-bottom: 1px; }
    .sol-eq { font-size: 12px; line-height: 1.5; }
    .sheet-foot { padding: 8px 14px; gap: 10px; }
    .foot-transport { min-width: 170px; gap: 8px; }
    .play-btn { padding: 4px 10px; font-size: 11.5px; }
    .foot-params { gap: 9px; }
    .param-pair input[type="range"] { width: 54px; }
  }

  @media (max-width: 470px) {
    .sheet-grid { grid-template-columns: 1fr; }
    .sheet-right { border-left: none; border-top: 2px double rgba(92, 76, 58, 0.22); }
    .sheet-head { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header class="sheet-head">
    <h1 class="sheet-title serif">特征值几何与非对称正定陷阱</h1>
    <div class="sheet-live" id="live-readout"></div>
  </header>

  <div class="sheet-grid">
    <div class="sheet-left">
      <canvas id="stage"></canvas>
      <div class="sheet-note serif" id="caption"></div>
    </div>

    <aside class="sheet-right serif">
      <div>
        <div class="sol-head">
          <h2>几何判据</h2>
          <span class="sol-total">线性代数</span>
        </div>

        <ol class="sol-steps" id="rubric-steps">
          <li class="sol-step" data-jump="4" data-step="0" data-active="true">
            <div class="sol-step-top"><span>（一）单位圆在矩阵下变成椭圆</span></div>
            <div class="sol-eq"><math display="inline"><mi>S</mi><mo>=</mo><mrow><mo>[</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>]</mo></mrow></math>，一般方向 <math display="inline"><mi>S</mi><mi>v</mi><mo>∦</mo><mi>v</mi></math></div>
          </li>
          <li class="sol-step" data-jump="16" data-step="1">
            <div class="sol-step-top"><span>（二）捕捉正交特征轴</span></div>
            <div class="sol-eq"><math display="inline"><mi>S</mi><mi>v</mi><mo>=</mo><mi>λ</mi><mi>v</mi></math>：<math display="inline"><msub><mi>λ</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn><mspace width="0.2em"/><mrow><mo stretchy="false">(</mo><mn>45</mn><mo>°</mo><mo stretchy="false">)</mo></mrow></math>，<math display="inline"><msub><mi>λ</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mspace width="0.2em"/><mrow><mo stretchy="false">(</mo><mn>135</mn><mo>°</mo><mo stretchy="false">)</mo></mrow></math></div>
          </li>
          <li class="sol-step" data-jump="28" data-step="2">
            <div class="sol-step-top"><span>（三）对称矩阵的瑞利商护城河</span></div>
            <div class="sol-eq"><math display="inline"><mn>1</mn><mo>≤</mo><msup><mi>v</mi><mi>T</mi></msup><mi>S</mi><mi>v</mi><mo>≤</mo><mn>3</mn></math>（全方向恒正定）</div>
          </li>
          <li class="sol-step" data-jump="42" data-step="3">
            <div class="sol-step-top"><span>（四）非对称上三角负值陷阱</span></div>
            <div class="sol-eq"><math display="inline"><mi>C</mi><mo>=</mo><mrow><mo>[</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>4</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>]</mo></mrow></math>，特征值全为 <math display="inline"><mn>1</mn></math> 但 <math display="inline"><msup><mi>v</mi><mi>T</mi></msup><mi>C</mi><mi>v</mi><mo>=</mo><mo>−</mo><mn>1</mn></math></div>
          </li>
        </ol>

        <div class="bet-box" id="bet-overlay" hidden>
          <div class="bet-head">
            <span>朱笔辨析 · 特征值全正必正定？</span>
            <button type="button" class="bet-skip" id="bet-skip">收起</button>
          </div>
          <button type="button" class="bet-choice" data-bet="wrong">甲：只要所有 <math display="inline"><msub><mi>λ</mi><mi>i</mi></msub><mo>&gt;</mo><mn>0</mn></math>，必有 <math display="inline"><msup><mi>v</mi><mi>T</mi></msup><mi>A</mi><mi>v</mi><mo>&gt;</mo><mn>0</mn></math></button>
          <button type="button" class="bet-choice" data-bet="right">乙：须检验对称部分 <math display="inline"><mfrac><mrow><mi>A</mi><mo>+</mo><msup><mi>A</mi><mi>T</mi></msup></mrow><mn>2</mn></mfrac></math>，非对称矩阵可取负值</button>
          <div class="bet-fb" id="bet-feedback" hidden></div>
        </div>
      </div>

      <div class="right-actions">
        <button type="button" class="text-link" id="quote-btn">带入课堂提问 ↗</button>
        <button type="button" class="red-btn" id="open-bet-btn">朱笔辨析</button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </aside>
  </div>

  <footer class="sheet-foot">
    <div class="foot-transport">
      <button type="button" class="play-btn" id="play-btn">▶ 演示</button>
      <input type="range" class="hairline-range" id="timeline" min="0" max="48" step="0.05" value="15.0" aria-label="时间轴">
      <span class="clock mono" id="time-readout">00:15 / 00:48</span>
    </div>
    <div class="foot-params">
      <div class="fn-tabs" role="group" aria-label="切换矩阵">
        <button type="button" class="fn-tab" data-mat="sym" aria-pressed="true"><math display="inline"><mi>S</mi></math> 对称</button>
        <button type="button" class="fn-tab" data-mat="asym" aria-pressed="false"><math display="inline"><mi>C</mi></math> 反例</button>
      </div>
      <label class="param-pair">
        <math display="inline"><mi>θ</mi></math>
        <input type="range" class="hairline-range" id="ang-slider" data-param="theta_deg" min="-180" max="180" step="1" value="45">
      </label>
    </div>
  </footer>
</div>

<script>
(function () {
  var TOTAL = 48;
  var playing = false;
  var interactiveOverride = false;
  var t = 15.0;
  var manualMat = 'sym';
  var manualDeg = 45;
  var lastTs = 0;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var playBtn = document.getElementById('play-btn');
  var timeline = document.getElementById('timeline');
  var timeEl = document.getElementById('time-readout');
  var liveEl = document.getElementById('live-readout');
  var captionEl = document.getElementById('caption');
  var angSlider = document.getElementById('ang-slider');
  var betOverlay = document.getElementById('bet-overlay');
  var betFeedback = document.getElementById('bet-feedback');
  var toastEl = document.getElementById('toast');
  var stepEls = Array.prototype.slice.call(document.querySelectorAll('#rubric-steps [data-step]'));
  var matBtns = Array.prototype.slice.call(document.querySelectorAll('[data-mat]'));
  var betBtns = Array.prototype.slice.call(document.querySelectorAll('[data-bet]'));

  function M(s) { return '<math display="inline">' + s + '</math>'; }

  var MATS = {
    sym: { label: 'S (实对称)', shortMath: M('<mi>S</mi>'), m: [[2, 1], [1, 2]], axes: [45, 135], scale: 34 },
    asym: { label: 'C (非对称)', shortMath: M('<mi>C</mi>'), m: [[1, 4], [0, 1]], axes: [0], scale: 26 }
  };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeInOut(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function formatTime(sec) {
    var s = Math.max(0, Math.floor(sec));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function applyM(m, x, y) { return [m[0][0] * x + m[0][1] * y, m[1][0] * x + m[1][1] * y]; }

  function computeState() {
    var sceneIdx = t < 12 ? 0 : t < 24 ? 1 : t < 36 ? 2 : 3;
    var matKey = manualMat, deg = manualDeg, noteHtml = '';

    if (!interactiveOverride) {
      if (sceneIdx === 0) {
        matKey = 'sym';
        deg = 12 + 24 * easeInOut(clamp(t / 12, 0, 1));
        noteHtml = '虚线圆是全部单位向量 ' + M('<mi>v</mi>') + '，实线椭圆是变换后的 ' + M('<mi>S</mi><mi>v</mi>') + '；一般方向都会被矩阵拧偏。';
      } else if (sceneIdx === 1) {
        matKey = 'sym';
        var p1 = clamp((t - 12) / 12, 0, 1);
        deg = p1 < 0.5 ? 45 : 45 + 90 * easeInOut((p1 - 0.5) * 2);
        noteHtml = '当 ' + M('<mi>θ</mi><mo>=</mo><mn>45</mn><mo>°</mo>') + ' 时 ' + M('<mi>S</mi><mi>v</mi><mo>=</mo><mn>3</mn><mi>v</mi>') + ' 零偏转共线；转至 ' + M('<mn>135</mn><mo>°</mo>') + ' 时 ' + M('<mi>S</mi><mi>v</mi><mo>=</mo><mi>v</mi>') + '，两轴严格正交。';
      } else if (sceneIdx === 2) {
        matKey = 'sym';
        deg = 135 - 180 * easeInOut(clamp((t - 24) / 12, 0, 1));
        noteHtml = '实对称矩阵特征轴正交，无论怎么旋转单位向量，二次型 ' + M('<msup><mi>v</mi><mi>T</mi></msup><mi>S</mi><mi>v</mi>') + ' 恒夹在 ' + M('<mo stretchy="false">[</mo><mn>1</mn><mo>,</mo><mn>3</mn><mo stretchy="false">]</mo>') + ' 之间。';
      } else {
        matKey = 'asym';
        deg = 20 - 65 * easeInOut(clamp((t - 36) / 12, 0, 1));
        noteHtml = M('<mi>C</mi>') + ' 特征值全为 ' + M('<mn>1</mn>') + '，但转至 ' + M('<mi>θ</mi><mo>=</mo><mo>−</mo><mn>45</mn><mo>°</mo>') + ' 时 ' + M('<mi>C</mi><mi>v</mi>') + ' 与 ' + M('<mi>v</mi>') + ' 夹钝角，二次型骤跌为 ' + M('<mo>−</mo><mn>1</mn><mo>&lt;</mo><mn>0</mn>') + '！';
      }
      manualMat = matKey;
      manualDeg = deg;
    } else {
      noteHtml = matKey === 'asym'
        ? '把 ' + M('<mi>θ</mi>') + ' 拖到 ' + M('<mo>−</mo><mn>45</mn><mo>°</mo>') + '，亲眼验证非对称矩阵虽特征值全正，二次型 ' + M('<msup><mi>v</mi><mi>T</mi></msup><mi>C</mi><mi>v</mi>') + ' 仍可取负值。'
        : '把 ' + M('<mi>θ</mi>') + ' 拖至 ' + M('<mn>45</mn><mo>°</mo>') + ' 或 ' + M('<mn>135</mn><mo>°</mo>') + '，捕捉 ' + M('<mi>v</mi>') + ' 与 ' + M('<mi>S</mi><mi>v</mi>') + ' 重合共线的瞬间。';
    }

    var cfg = MATS[matKey];
    var rad = (deg * Math.PI) / 180;
    var vx = Math.cos(rad), vy = Math.sin(rad);
    var av = applyM(cfg.m, vx, vy);
    var quad = vx * av[0] + vy * av[1];
    var avLen = Math.hypot(av[0], av[1]) || 1;
    var gapDeg = (Math.acos(clamp(quad / avLen, -1, 1)) * 180) / Math.PI;
    return {
      sceneIdx: sceneIdx, matKey: matKey, cfg: cfg, deg: deg,
      vx: vx, vy: vy, avx: av[0], avy: av[1],
      quad: quad, gapDeg: gapDeg, noteHtml: noteHtml
    };
  }

  function drawArrow(x0, y0, x1, y1, color, width) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    var ang = Math.atan2(y1 - y0, x1 - x0), head = 8;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - head * Math.cos(ang - 0.36), y1 - head * Math.sin(ang - 0.36));
    ctx.lineTo(x1 - head * Math.cos(ang + 0.36), y1 - head * Math.sin(ang + 0.36));
    ctx.closePath(); ctx.fill();
  }

  function render() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var W = Math.max(260, Math.round(rect.width));
    var H = Math.max(220, Math.round(rect.height));
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var st = computeState();
    var cfg = st.cfg;
    var cx = W * 0.50, cy = H * 0.52;
    var sc = Math.min(cfg.scale, Math.min(W, H) * 0.125);
    function mx(x) { return cx + x * sc; }
    function my(y) { return cy - y * sc; }

    ctx.fillStyle = '#faf6ee';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid
    ctx.strokeStyle = 'rgba(92, 76, 58, 0.08)';
    ctx.lineWidth = 1;
    for (var g = -6; g <= 6; g++) {
      ctx.beginPath(); ctx.moveTo(mx(g), 10); ctx.lineTo(mx(g), H - 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, my(g)); ctx.lineTo(W - 12, my(g)); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = 'rgba(44, 39, 34, 0.32)';
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(14, cy); ctx.lineTo(W - 14, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 12); ctx.lineTo(cx, H - 12); ctx.stroke();

    // Eigen axes (dashed walnut)
    ctx.save();
    ctx.strokeStyle = 'rgba(125, 92, 70, 0.44)';
    ctx.lineWidth = 1.1;
    ctx.setLineDash([4, 4]);
    cfg.axes.forEach(function (aDeg) {
      var r = (aDeg * Math.PI) / 180;
      ctx.beginPath();
      ctx.moveTo(mx(-5 * Math.cos(r)), my(-5 * Math.sin(r)));
      ctx.lineTo(mx(5 * Math.cos(r)), my(5 * Math.sin(r)));
      ctx.stroke();
    });
    ctx.restore();

    // Unit circle (faint dashed)
    ctx.save();
    ctx.strokeStyle = 'rgba(92, 76, 58, 0.38)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(cx, cy, sc, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Transformed ellipse
    ctx.save();
    ctx.strokeStyle = '#26211c';
    ctx.lineWidth = 2.0;
    ctx.fillStyle = st.quad < 0 ? 'rgba(168, 56, 37, 0.08)' : 'rgba(125, 92, 70, 0.06)';
    ctx.beginPath();
    for (var i = 0; i <= 120; i++) {
      var ang = (i / 120) * Math.PI * 2;
      var p = applyM(cfg.m, Math.cos(ang), Math.sin(ang));
      if (i === 0) ctx.moveTo(mx(p[0]), my(p[1]));
      else ctx.lineTo(mx(p[0]), my(p[1]));
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Vectors v (ink) and Av (vermilion)
    drawArrow(cx, cy, mx(st.avx), my(st.avy), '#a83825', 2.2);
    drawArrow(cx, cy, mx(st.vx), my(st.vy), '#26211c', 2.0);

    ctx.font = 'italic 13px "Times New Roman", Georgia, serif';
    ctx.fillStyle = '#26211c';
    var vOffX = st.vx >= 0 ? 10 : -18;
    var vOffY = st.vy >= 0 ? 14 : -8;
    ctx.fillText('v', mx(st.vx) + vOffX, my(st.vy) + vOffY);
    ctx.fillStyle = '#a83825';
    ctx.fillText(st.matKey === 'sym' ? 'Sv' : 'Cv', mx(st.avx) + (st.avx >= 0 ? 8 : -24), my(st.avy) + (st.avy >= 0 ? -7 : 14));

    // DOM updates
    var matSym = st.matKey === 'sym' ? 'S' : 'C';
    var qStr = st.quad.toFixed(2);
    liveEl.innerHTML =
      cfg.shortMath +
      ' · ' + M('<mi>θ</mi><mo>=</mo><mn>' + Math.round(st.deg) + '</mn><mo>°</mo>') +
      ' · ' + M('<msup><mi>v</mi><mi>T</mi></msup><mi>' + matSym + '</mi><mi>v</mi><mo>=</mo>') +
      '<strong>' + M('<mn>' + qStr + '</mn>') + '</strong>';

    captionEl.innerHTML = '<span class="sheet-note-tag">批注：</span>' + st.noteHtml;
    timeEl.textContent = formatTime(t) + ' / ' + formatTime(TOTAL);
    timeline.value = t.toFixed(2);
    angSlider.value = Math.round(clamp(st.deg, -180, 180));
    playBtn.textContent = playing ? '❚❚ 暂停' : '▶ 演示';

    for (var mi = 0; mi < matBtns.length; mi++) {
      matBtns[mi].setAttribute('aria-pressed', matBtns[mi].dataset.mat === st.matKey ? 'true' : 'false');
    }
    for (var si = 0; si < stepEls.length; si++) {
      stepEls[si].setAttribute('data-active', si === st.sceneIdx ? 'true' : 'false');
    }

    if (window.notara && typeof window.notara.setState === 'function') {
      window.notara.setState({
        summary: '代码微课《特征值几何与非对称正定陷阱》停在 ' + formatTime(t) + '（第 ' + (st.sceneIdx + 1) + ' 幕，' + cfg.label + '，θ=' + Math.round(st.deg) + '°，vᵀAv=' + st.quad.toFixed(2) + '）。',
        params: { timestamp: formatTime(t), scene: st.sceneIdx + 1, matrix: cfg.label, thetaDeg: Math.round(st.deg), quadraticForm: Number(st.quad.toFixed(2)), angleGapDeg: Number(st.gapDeg.toFixed(1)) }
      }, { immediate: !playing });
    }
  }

  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.08, (ts - lastTs) / 1000);
    lastTs = ts;
    t += dt;
    if (t >= TOTAL) { t = TOTAL; playing = false; }
    render();
    if (playing) requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', function () {
    if (playing) {
      playing = false; interactiveOverride = true; render();
    } else {
      if (t >= TOTAL - 0.1) t = 0;
      betOverlay.hidden = true;
      interactiveOverride = false; playing = true; lastTs = 0;
      render(); requestAnimationFrame(tick);
    }
  });

  timeline.addEventListener('input', function () {
    t = Number(timeline.value) || 0;
    interactiveOverride = false;
    render();
  });

  stepEls.forEach(function (el) {
    el.addEventListener('click', function () {
      playing = false; interactiveOverride = false;
      t = Number(el.dataset.jump) || 0;
      betOverlay.hidden = true;
      render();
    });
  });

  matBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      playing = false; interactiveOverride = true;
      manualMat = btn.dataset.mat || 'sym';
      if (manualMat === 'asym') manualDeg = -45;
      render();
    });
  });

  angSlider.addEventListener('input', function () {
    playing = false; interactiveOverride = true;
    manualDeg = Number(angSlider.value) || 0;
    render();
  });

  document.getElementById('open-bet-btn').addEventListener('click', function () {
    playing = false;
    betOverlay.hidden = !betOverlay.hidden;
    betFeedback.hidden = true;
    render();
  });

  document.getElementById('bet-skip').addEventListener('click', function () {
    betOverlay.hidden = true;
  });

  betBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var wrong = btn.dataset.bet === 'wrong';
      playing = false; interactiveOverride = true;
      manualMat = 'asym'; manualDeg = -45;
      betFeedback.hidden = false;
      betFeedback.innerHTML = wrong
        ? '<strong>朱笔反例：</strong>已切到 ' + M('<mi>C</mi>') + '、' + M('<mi>θ</mi><mo>=</mo><mo>−</mo><mn>45</mn><mo>°</mo>') + '——特征值全为 ' + M('<mn>1</mn>') + '，但 ' + M('<msup><mi>v</mi><mi>T</mi></msup><mi>C</mi><mi>v</mi><mo>=</mo><mo>−</mo><mn>1</mn><mo>&lt;</mo><mn>0</mn>') + '！'
        : '<strong>判断准确：</strong>二次型只认对称部分，非对称矩阵不能单靠特征值判正定。';
      render();
    });
  });

  document.getElementById('quote-btn').addEventListener('click', function () {
    playing = false;
    var st = computeState();
    var msg = '我在代码微课《特征值几何与非对称正定陷阱》第 ' + formatTime(t) + ' 暂停了（' + st.cfg.label + '，θ=' + Math.round(st.deg) + '°，vᵀAv=' + st.quad.toFixed(2) + '），请结合这一帧帮我核对直觉。';
    if (window.notara && typeof window.notara.quoteState === 'function') {
      window.notara.quoteState({
        summary: msg,
        params: { timestamp: formatTime(t), matrix: st.cfg.label, thetaDeg: Math.round(st.deg), quadraticForm: Number(st.quad.toFixed(2)) }
      });
      toastEl.hidden = false; toastEl.textContent = '已带入课堂草稿。';
    } else {
      toastEl.hidden = false; toastEl.textContent = '已记录当前帧（' + st.cfg.label + ', θ=' + Math.round(st.deg) + '°）。';
    }
    render();
  });

  if (window.notara && typeof window.notara.onSeek === 'function') {
    window.notara.onSeek(function (detail) {
      if (!detail || typeof detail !== 'object') return;
      playing = false;
      if (typeof detail.time === 'number' && isFinite(detail.time)) {
        t = clamp(detail.time, 0, TOTAL);
        interactiveOverride = false;
      }
      if (detail.params && typeof detail.params === 'object') {
        if (detail.params.mat && MATS[detail.params.mat]) { manualMat = detail.params.mat; interactiveOverride = true; }
        if (typeof detail.params.thetaDeg === 'number') { manualDeg = clamp(detail.params.thetaDeg, -180, 180); interactiveOverride = true; }
      }
      render();
    });
  }

  window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
