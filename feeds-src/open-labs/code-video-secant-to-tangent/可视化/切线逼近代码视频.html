<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码微课 · 割线逼近切线与凹凸失效边界</title>
<style>
  :root {
    --cv-bg: var(--pa-bg-surface, #fdfbf7);
    --cv-subtle: var(--pa-bg-subtle, #f7f3ea);
    --cv-muted: var(--pa-bg-muted, #f0ebe0);
    --cv-ink: var(--pa-ink, #2c2722);
    --cv-ink-2: var(--pa-ink-secondary, #6c6358);
    --cv-ink-3: var(--pa-ink-muted, #968c80);
    --cv-border: var(--pa-border, rgba(82, 72, 60, 0.14));
    --cv-border-strong: var(--pa-border-strong, rgba(82, 72, 60, 0.24));
    --cv-accent: var(--pa-accent, #7d5c46);
    --cv-terracotta: #b4532a;
    --cv-indigo: #3f536e;
    --cv-font: var(--pa-font-sans, "PingFang SC", "Noto Serif SC", Georgia, serif);
    --cv-mono: var(--pa-font-mono, "SF Mono", ui-monospace, monospace);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 14px 16px;
    background: var(--cv-bg);
    color: var(--cv-ink);
    font-family: var(--cv-font);
    font-size: 13px;
    line-height: 1.55;
  }
  .cv-shell {
    max-width: 820px;
    margin: 0 auto;
    border: 1px solid var(--cv-border-strong);
    border-radius: 12px;
    background: var(--cv-bg);
    overflow: hidden;
  }
  .cv-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--cv-subtle);
    border-bottom: 1px solid var(--cv-border);
  }
  .cv-title-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cv-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(125, 92, 70, 0.12);
    color: var(--cv-accent);
  }
  .cv-badge--live {
    background: rgba(180, 83, 42, 0.13);
    color: var(--cv-terracotta);
  }
  .cv-title {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--cv-ink);
  }
  .cv-meta {
    font-size: 11.5px;
    color: var(--cv-ink-3);
    font-family: var(--cv-mono);
  }
  .cv-stage-wrap {
    position: relative;
    background: #fcfaf4;
    border-bottom: 1px solid var(--cv-border);
  }
  canvas {
    display: block;
    width: 100%;
    height: 310px;
  }
  .cv-hud {
    position: absolute;
    top: 12px;
    right: 12px;
    min-width: 196px;
    padding: 8px 11px;
    border-radius: 9px;
    background: rgba(253, 251, 247, 0.92);
    border: 1px solid var(--cv-border-strong);
    font-family: var(--cv-mono);
    font-size: 11.5px;
    color: var(--cv-ink);
  }
  .cv-hud-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 1.5px 0;
  }
  .cv-hud-label { color: var(--cv-ink-2); font-family: var(--cv-font); }
  .cv-subtitle-bar {
    padding: 10px 14px;
    background: var(--cv-subtle);
    border-bottom: 1px solid var(--cv-border);
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .cv-subtitle-text {
    margin: 0;
    font-size: 13px;
    color: var(--cv-ink);
    line-height: 1.58;
  }
  .cv-subtitle-scene {
    display: inline-block;
    margin-right: 6px;
    font-weight: 600;
    color: var(--cv-accent);
  }
  .cv-transport {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--cv-border);
  }
  .cv-transport-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .cv-play-btn {
    border: 1px solid var(--cv-ink);
    background: var(--cv-ink);
    color: #fdfbf7;
    border-radius: 7px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    min-width: 112px;
  }
  .cv-play-btn:hover { opacity: 0.92; }
  .cv-time {
    font-family: var(--cv-mono);
    font-size: 11.5px;
    color: var(--cv-ink-2);
    min-width: 88px;
  }
  .cv-timeline {
    flex: 1 1 200px;
    accent-color: var(--cv-accent);
    cursor: pointer;
  }
  .cv-speed-group {
    display: inline-flex;
    gap: 4px;
  }
  .cv-pill {
    border: 1px solid var(--cv-border-strong);
    background: var(--cv-bg);
    color: var(--cv-ink-2);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .cv-pill[aria-pressed="true"] {
    background: var(--cv-accent);
    border-color: var(--cv-accent);
    color: #fdfbf7;
    font-weight: 600;
  }
  .cv-chapters {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }
  .cv-chapter-btn {
    text-align: left;
    border: 1px solid var(--cv-border);
    background: var(--cv-subtle);
    color: var(--cv-ink-2);
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 11.5px;
    cursor: pointer;
    line-height: 1.35;
  }
  .cv-chapter-btn strong {
    display: block;
    color: var(--cv-ink);
    font-size: 11.5px;
    margin-bottom: 1px;
  }
  .cv-chapter-btn[aria-current="step"] {
    border-color: var(--cv-accent);
    background: rgba(125, 92, 70, 0.11);
  }
  .cv-interact {
    padding: 10px 14px 12px;
    background: var(--cv-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .cv-interact-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .cv-slider-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--cv-ink-2);
  }
  .cv-slider-wrap input {
    width: 128px;
    accent-color: var(--cv-terracotta);
  }
  .cv-quote-btn {
    border: 1px solid var(--cv-accent);
    background: rgba(125, 92, 70, 0.08);
    color: var(--cv-accent);
    border-radius: 7px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .cv-quote-btn:hover {
    background: var(--cv-accent);
    color: #fdfbf7;
  }
  .cv-toast {
    width: 100%;
    font-size: 11.5px;
    color: var(--cv-accent);
    min-height: 16px;
  }
  @media (max-width: 640px) {
    .cv-chapters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cv-hud { position: static; margin: 8px 12px; }
    canvas { height: 250px; }
  }
</style>
</head>
<body>
<div class="cv-shell">
  <header class="cv-head">
    <div class="cv-title-group">
      <span class="cv-badge" id="mode-badge">矢量代码视频 · 60fps</span>
      <h1 class="cv-title">割线逼近切线与凹凸失效边界</h1>
    </div>
    <span class="cv-meta">18 KB 脚本 · 随时暂停动手改</span>
  </header>

  <div class="cv-stage-wrap">
    <canvas id="stage" aria-label="割线逼近切线与凹凸边界矢量动画"></canvas>
    <div class="cv-hud" id="hud">
      <div class="cv-hud-row"><span class="cv-hud-label">当前函数</span><strong id="hud-fn">y = x²</strong></div>
      <div class="cv-hud-row"><span class="cv-hud-label">切点</span><span id="hud-pt">A(1, 1)</span></div>
      <div class="cv-hud-row"><span class="cv-hud-label">采样间距 h</span><strong id="hud-h">0.95</strong></div>
      <div class="cv-hud-row"><span class="cv-hud-label">割线斜率</span><strong id="hud-sec">2.95</strong></div>
      <div class="cv-hud-row"><span class="cv-hud-label">切线斜率</span><span id="hud-tan">2.00</span></div>
      <div class="cv-hud-row"><span class="cv-hud-label">二阶导 f''</span><strong id="hud-d2">恒 &gt; 0（单侧成立）</strong></div>
    </div>
  </div>

  <div class="cv-subtitle-bar">
    <p class="cv-subtitle-text" id="subtitle"></p>
  </div>

  <div class="cv-transport">
    <div class="cv-transport-row">
      <button type="button" class="cv-play-btn" id="play-btn">▶ 播放代码视频</button>
      <span class="cv-time" id="time-readout">00:00 / 00:48</span>
      <input type="range" id="timeline" class="cv-timeline" min="0" max="48" step="0.05" value="0" aria-label="代码视频时间轴">
      <div class="cv-speed-group" role="group" aria-label="播放倍速">
        <button type="button" class="cv-pill" data-speed="0.75" aria-pressed="false">0.75×</button>
        <button type="button" class="cv-pill" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" class="cv-pill" data-speed="1.5" aria-pressed="false">1.5×</button>
      </div>
    </div>

    <div class="cv-chapters" role="group" aria-label="分幕跳转">
      <button type="button" class="cv-chapter-btn" data-jump="0" aria-current="step">
        <strong>01 · 割线起手</strong>为什么需要两点
      </button>
      <button type="button" class="cv-chapter-btn" data-jump="12">
        <strong>02 · h 推向 0</strong>差商约去因子 h
      </button>
      <button type="button" class="cv-chapter-btn" data-jump="24">
        <strong>03 · eˣ 单侧界</strong>二阶导保号托底
      </button>
      <button type="button" class="cv-chapter-btn" data-jump="36">
        <strong>04 · t³ 反例</strong>拐点直接穿切线
      </button>
    </div>
  </div>

  <div class="cv-interact">
    <div class="cv-interact-left">
      <div class="cv-speed-group" role="group" aria-label="随时切换实验函数">
        <button type="button" class="cv-pill" data-fn="quad" aria-pressed="true">y = x²</button>
        <button type="button" class="cv-pill" data-fn="exp" aria-pressed="false">y = eˣ</button>
        <button type="button" class="cv-pill" data-fn="cubic" aria-pressed="false">y = t³</button>
      </div>
      <label class="cv-slider-wrap">
        <span>手动拖动 h：</span>
        <input type="range" id="h-slider" data-param="h" min="-1.10" max="1.20" step="0.02" value="0.96">
      </label>
    </div>
    <button type="button" class="cv-quote-btn" id="quote-btn">把当前帧带给 AI 老师 ↗</button>
    <div class="cv-toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  var TOTAL = 48;
  var playing = false;
  var interactiveOverride = false;
  var speed = 1;
  var t = 4.2; // Start at an immediately expressive frame in Scene 1
  var manualFn = 'quad';
  var manualH = 0.96;
  var lastTs = 0;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var playBtn = document.getElementById('play-btn');
  var timeEl = document.getElementById('time-readout');
  var timeline = document.getElementById('timeline');
  var subtitleEl = document.getElementById('subtitle');
  var badgeEl = document.getElementById('mode-badge');
  var hSlider = document.getElementById('h-slider');
  var toastEl = document.getElementById('toast');

  var hudFn = document.getElementById('hud-fn');
  var hudPt = document.getElementById('hud-pt');
  var hudH = document.getElementById('hud-h');
  var hudSec = document.getElementById('hud-sec');
  var hudTan = document.getElementById('hud-tan');
  var hudD2 = document.getElementById('hud-d2');

  var speedBtns = Array.prototype.slice.call(document.querySelectorAll('[data-speed]'));
  var fnBtns = Array.prototype.slice.call(document.querySelectorAll('[data-fn]'));
  var chapterBtns = Array.prototype.slice.call(document.querySelectorAll('[data-jump]'));

  var FUNCS = {
    quad: {
      label: 'y = x²',
      ptLabel: 'A(1, 1)',
      x0: 1,
      f: function (x) { return x * x; },
      df: function (x) { return 2 * x; },
      d2Text: '恒 = 2 > 0（凸）',
      domain: [-0.6, 2.7],
      range: [-0.4, 5.4]
    },
    exp: {
      label: 'y = eˣ',
      ptLabel: 'A(0, 1)',
      x0: 0,
      f: function (x) { return Math.exp(x); },
      df: function (x) { return Math.exp(x); },
      d2Text: 'eˣ > 0（单侧恒成立）',
      domain: [-1.8, 1.8],
      range: [-0.6, 4.6]
    },
    cubic: {
      label: 'y = t³',
      ptLabel: 'A(0, 0)',
      x0: 0,
      f: function (x) { return x * x * x; },
      df: function (x) { return 3 * x * x; },
      d2Text: '6t 在 0 处变号（穿切线）',
      domain: [-1.7, 1.7],
      range: [-2.4, 2.4]
    }
  };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeInOut(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }

  function formatTime(sec) {
    var s = Math.max(0, Math.floor(sec));
    var mm = String(Math.floor(s / 60)).padStart(2, '0');
    var ss = String(s % 60).padStart(2, '0');
    return mm + ':' + ss;
  }

  function computeState() {
    var sceneIdx = t < 12 ? 0 : t < 24 ? 1 : t < 36 ? 2 : 3;
    var fnKey = manualFn;
    var h = manualH;
    var showShading = false;
    var captionTitle = '';
    var captionBody = '';

    if (!interactiveOverride) {
      if (sceneIdx === 0) {
        fnKey = 'quad';
        var p0 = clamp(t / 12, 0, 1);
        h = 1.15 - 0.35 * easeInOut(p0);
        captionTitle = '第 1 幕 · 割线需要两个点：';
        captionBody = '仅凭单点 A(1,1) 定不出方向。先取邻近点 B(1+h, (1+h)²)，拉出割线并读出差商斜率 (f(1+h)-f(1))/h = 2+h。';
      } else if (sceneIdx === 1) {
        fnKey = 'quad';
        var p1 = clamp((t - 12) / 12, 0, 1);
        h = 0.80 * (1 - easeInOut(p1)) + 0.03;
        captionTitle = '第 2 幕 · 把间距 h 推向 0：';
        captionBody = '因为 h 始终不等于 0，才能合法约去因子 h 得到 2+h。看着动点 B 贴近 A，割线正严丝合缝地并入切线斜率 2.00。';
      } else if (sceneIdx === 2) {
        fnKey = 'exp';
        showShading = true;
        var p2 = clamp((t - 24) / 12, 0, 1);
        h = -1.15 + 2.30 * easeInOut(p2);
        if (Math.abs(h) < 0.06) h = h < 0 ? -0.06 : 0.06;
        captionTitle = '第 3 幕 · eˣ 为何恒在切线上方：';
        captionBody = '看棕色阴影区：因二阶导 f"(x)=eˣ > 0 恒正，斜率一路递增，整条曲线被牢牢托在切线 y=x+1 上方，单侧不等式 eˣ ≥ x+1 成立。';
      } else {
        fnKey = 'cubic';
        showShading = true;
        var p3 = clamp((t - 36) / 12, 0, 1);
        h = -1.15 + 2.30 * easeInOut(p3);
        if (Math.abs(h) < 0.06) h = h < 0 ? -0.06 : 0.06;
        captionTitle = '第 4 幕 · 反例 f(t)=t³ 穿过切线：';
        captionBody = '原点切线为 y=0，但 f"(t)=6t 在 t=0 由负变正。左侧（蓝灰区）落于切线下方，右侧（赤陶区）升至上方——“切线”本身绝不保证单侧！';
      }
      manualFn = fnKey;
      manualH = h;
    } else {
      showShading = fnKey === 'exp' || fnKey === 'cubic';
      captionTitle = '交互暂停态（' + formatTime(t) + '）：';
      if (fnKey === 'quad') {
        captionBody = '你正在亲自操控抛物线 y=x² 的采样点 B。把 h 分别拖向 +0.04 与 -0.04，核对两侧割线斜率是否都收敛于 2.00。';
      } else if (fnKey === 'exp') {
        captionBody = '你正在检视指数函数 y=eˣ 与原点切线 y=x+1：无论怎么拖动采样点，差值 eˣ - (x+1) 始终非负。';
      } else {
        captionBody = '你正在检视反例 y=t³：拖动采样点跨过 t=0，亲眼确认图像直接从切线 y=0 的下方穿到上方。';
      }
    }

    var cfg = FUNCS[fnKey];
    var safeH = Math.abs(h) < 0.02 ? (h < 0 ? -0.02 : 0.02) : h;
    var x0 = cfg.x0;
    var y0 = cfg.f(x0);
    var x1 = x0 + safeH;
    var y1 = cfg.f(x1);
    var secSlope = (y1 - y0) / safeH;
    var tanSlope = cfg.df(x0);

    return {
      sceneIdx: sceneIdx,
      fnKey: fnKey,
      cfg: cfg,
      h: safeH,
      x0: x0, y0: y0,
      x1: x1, y1: y1,
      secSlope: secSlope,
      tanSlope: tanSlope,
      showShading: showShading,
      captionTitle: captionTitle,
      captionBody: captionBody
    };
  }

  function render() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var W = Math.max(300, Math.round(rect.width));
    var H = Math.max(220, Math.round(rect.height));
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var st = computeState();
    var cfg = st.cfg;
    var pad = { l: 42, r: 24, t: 22, b: 30 };
    var pw = W - pad.l - pad.r;
    var ph = H - pad.t - pad.b;

    function mx(x) {
      return pad.l + ((x - cfg.domain[0]) / (cfg.domain[1] - cfg.domain[0])) * pw;
    }
    function my(y) {
      return pad.t + ph - ((y - cfg.range[0]) / (cfg.range[1] - cfg.range[0])) * ph;
    }

    // Warm cotton paper backdrop + ruled grid
    ctx.fillStyle = '#fcfaf4';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(125, 92, 70, 0.08)';
    ctx.lineWidth = 1;
    for (var gx = Math.ceil(cfg.domain[0]); gx <= Math.floor(cfg.domain[1]); gx++) {
      var px = mx(gx);
      ctx.beginPath(); ctx.moveTo(px, pad.t); ctx.lineTo(px, H - pad.b); ctx.stroke();
    }
    for (var gy = Math.ceil(cfg.range[0]); gy <= Math.floor(cfg.range[1]); gy++) {
      var py = my(gy);
      ctx.beginPath(); ctx.moveTo(pad.l, py); ctx.lineTo(W - pad.r, py); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = '#b9afa0';
    ctx.lineWidth = 1.25;
    if (cfg.range[0] <= 0 && cfg.range[1] >= 0) {
      var yAxis = my(0);
      ctx.beginPath(); ctx.moveTo(pad.l, yAxis); ctx.lineTo(W - pad.r, yAxis); ctx.stroke();
    }
    if (cfg.domain[0] <= 0 && cfg.domain[1] >= 0) {
      var xAxis = mx(0);
      ctx.beginPath(); ctx.moveTo(xAxis, pad.t); ctx.lineTo(xAxis, H - pad.b); ctx.stroke();
    }

    // Optional single-side gap shading (zero green: warm amber & slate indigo only)
    if (st.showShading) {
      var steps = 110;
      for (var i = 0; i < steps; i++) {
        var xa = cfg.domain[0] + (i / steps) * (cfg.domain[1] - cfg.domain[0]);
        var xb = cfg.domain[0] + ((i + 1) / steps) * (cfg.domain[1] - cfg.domain[0]);
        var xm = 0.5 * (xa + xb);
        var fy = cfg.f(xm);
        var ty = st.y0 + st.tanSlope * (xm - st.x0);
        if (fy < cfg.range[0] - 2 || fy > cfg.range[1] + 2) continue;
        ctx.fillStyle = fy >= ty ? 'rgba(180, 83, 42, 0.14)' : 'rgba(63, 83, 110, 0.16)';
        ctx.beginPath();
        ctx.moveTo(mx(xa), my(cfg.f(xa)));
        ctx.lineTo(mx(xb), my(cfg.f(xb)));
        ctx.lineTo(mx(xb), my(st.y0 + st.tanSlope * (xb - st.x0)));
        ctx.lineTo(mx(xa), my(st.y0 + st.tanSlope * (xa - st.x0)));
        ctx.closePath();
        ctx.fill();
      }
    }

    // Tangent line (dashed slate/walnut)
    ctx.save();
    ctx.beginPath();
    ctx.rect(pad.l, pad.t, pw, ph);
    ctx.clip();

    var txA = cfg.domain[0], tyA = st.y0 + st.tanSlope * (txA - st.x0);
    var txB = cfg.domain[1], tyB = st.y0 + st.tanSlope * (txB - st.x0);
    ctx.strokeStyle = '#7d5c46';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(mx(txA), my(tyA));
    ctx.lineTo(mx(txB), my(tyB));
    ctx.stroke();
    ctx.setLineDash([]);

    // Main curve
    ctx.strokeStyle = '#2c2722';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    var curveSteps = 180;
    for (var c = 0; c <= curveSteps; c++) {
      var cx = cfg.domain[0] + (c / curveSteps) * (cfg.domain[1] - cfg.domain[0]);
      var cy = cfg.f(cx);
      if (c === 0) ctx.moveTo(mx(cx), my(cy));
      else ctx.lineTo(mx(cx), my(cy));
    }
    ctx.stroke();

    // Secant line (solid terracotta)
    var sxA = cfg.domain[0], syA = st.y0 + st.secSlope * (sxA - st.x0);
    var sxB = cfg.domain[1], syB = st.y0 + st.secSlope * (sxB - st.x0);
    ctx.strokeStyle = '#b4532a';
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.moveTo(mx(sxA), my(syA));
    ctx.lineTo(mx(sxB), my(syB));
    ctx.stroke();

    // Delta triangle for secant step
    ctx.strokeStyle = 'rgba(180, 83, 42, 0.55)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(mx(st.x0), my(st.y0));
    ctx.lineTo(mx(st.x1), my(st.y0));
    ctx.lineTo(mx(st.x1), my(st.y1));
    ctx.stroke();
    ctx.setLineDash([]);

    // Point A & Point B
    ctx.fillStyle = '#2c2722';
    ctx.beginPath();
    ctx.arc(mx(st.x0), my(st.y0), 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#b4532a';
    ctx.beginPath();
    ctx.arc(mx(st.x1), my(st.y1), 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fdfbf7';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.font = '600 11.5px "SF Mono", ui-monospace, monospace';
    ctx.fillStyle = '#2c2722';
    ctx.fillText(cfg.ptLabel, mx(st.x0) + 8, my(st.y0) + 15);
    ctx.fillStyle = '#b4532a';
    ctx.fillText('B(h=' + st.h.toFixed(2) + ')', mx(st.x1) + 8, my(st.y1) - 8);
    ctx.restore();

    // Update HUD & Controls
    hudFn.textContent = cfg.label;
    hudPt.textContent = cfg.ptLabel;
    hudH.textContent = st.h.toFixed(2);
    hudSec.textContent = st.secSlope.toFixed(2);
    hudTan.textContent = st.tanSlope.toFixed(2);
    hudD2.textContent = cfg.d2Text;
    subtitleEl.innerHTML = '<span class="cv-subtitle-scene">' + st.captionTitle + '</span>' + st.captionBody;
    timeEl.textContent = formatTime(t) + ' / ' + formatTime(TOTAL);
    timeline.value = t.toFixed(2);
    hSlider.value = clamp(st.h, -1.10, 1.20).toFixed(2);

    badgeEl.textContent = interactiveOverride
      ? '交互暂停态 · 已接管参数'
      : playing
        ? '播放中 · 60fps 矢量代码视频'
        : '矢量代码视频 · 60fps';
    badgeEl.className = interactiveOverride ? 'cv-badge cv-badge--live' : 'cv-badge';
    playBtn.textContent = playing ? '❚❚ 暂停并动手改' : '▶ 播放代码视频';

    for (var j = 0; j < fnBtns.length; j++) {
      fnBtns[j].setAttribute('aria-pressed', fnBtns[j].dataset.fn === st.fnKey ? 'true' : 'false');
    }
    for (var k = 0; k < chapterBtns.length; k++) {
      if (k === st.sceneIdx) chapterBtns[k].setAttribute('aria-current', 'step');
      else chapterBtns[k].removeAttribute('aria-current');
    }

    if (window.notara && typeof window.notara.setState === 'function') {
      window.notara.setState({
        summary: '代码视频《割线逼近切线与凹凸失效边界》停在 ' + formatTime(t) + '（' + cfg.label + '，h=' + st.h.toFixed(2) + '，割线斜率=' + st.secSlope.toFixed(2) + '，切线斜率=' + st.tanSlope.toFixed(2) + '）。',
        params: { timestamp: formatTime(t), fn: cfg.label, h: Number(st.h.toFixed(2)), secantSlope: Number(st.secSlope.toFixed(2)), tangentSlope: Number(st.tanSlope.toFixed(2)) }
      });
    }
  }

  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.08, (ts - lastTs) / 1000) * speed;
    lastTs = ts;
    t += dt;
    if (t >= TOTAL) {
      t = TOTAL;
      playing = false;
    }
    render();
    if (playing) requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', function () {
    if (playing) {
      playing = false;
      interactiveOverride = true;
      render();
    } else {
      if (t >= TOTAL - 0.1) t = 0;
      interactiveOverride = false;
      playing = true;
      lastTs = 0;
      render();
      requestAnimationFrame(tick);
    }
  });

  timeline.addEventListener('input', function () {
    t = Number(timeline.value) || 0;
    interactiveOverride = false;
    render();
  });

  speedBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      speed = Number(btn.dataset.speed) || 1;
      speedBtns.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
    });
  });

  chapterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      t = Number(btn.dataset.jump) || 0;
      interactiveOverride = false;
      render();
    });
  });

  fnBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      playing = false;
      interactiveOverride = true;
      manualFn = btn.dataset.fn || 'quad';
      render();
    });
  });

  hSlider.addEventListener('input', function () {
    playing = false;
    interactiveOverride = true;
    manualH = Number(hSlider.value) || 0.2;
    render();
  });

  document.getElementById('quote-btn').addEventListener('click', function () {
    playing = false;
    var st = computeState();
    var msg = '我在代码视频《割线逼近切线与凹凸失效边界》第 ' + formatTime(t) + ' 暂停了（当前函数 ' + st.cfg.label + '，h=' + st.h.toFixed(2) + '，割线斜率 ' + st.secSlope.toFixed(2) + '，切线斜率 ' + st.tanSlope.toFixed(2) + '），请结合这一帧帮我检验我的理解。';
    if (window.notara && typeof window.notara.quoteState === 'function') {
      window.notara.quoteState({
        summary: msg,
        params: { timestamp: formatTime(t), fn: st.cfg.label, h: Number(st.h.toFixed(2)), secantSlope: Number(st.secSlope.toFixed(2)), tangentSlope: Number(st.tanSlope.toFixed(2)) }
      });
      toastEl.textContent = '已将当前帧状态（' + st.cfg.label + ', h=' + st.h.toFixed(2) + '）带入书房课堂草稿。';
    } else {
      toastEl.textContent = '当前帧上下文已生成：' + msg;
    }
    render();
  });

  window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
