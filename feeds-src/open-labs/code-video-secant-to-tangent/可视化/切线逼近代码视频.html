<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>割线逼近切线与凹凸边界 · 代码微课</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f6f1e6;
    color: #2c2722;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", Georgia, "Times New Roman", serif;
  }
  .mono {
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  math {
    font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", "Times New Roman", "Songti SC", serif;
    font-size: 1.04em;
    color: inherit;
  }
  math[display="inline"] { vertical-align: middle; }

  .sheet { width: 100%; background: #f6f1e6; color: #2c2722; overflow: hidden; }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 20px;
    background: #f9f5ec;
    border-bottom: 2px double rgba(92, 76, 58, 0.24);
  }
  .sheet-title { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: 0.02em; color: #26211c; }
  .sheet-live { font-size: 13px; color: #6b5f52; white-space: nowrap; }
  .sheet-live strong { color: #a83825; font-weight: 600; }

  .sheet-grid { display: grid; grid-template-columns: 1.38fr 1fr; min-height: 368px; }
  .sheet-left {
    padding: 12px 18px 14px;
    background: #faf6ee;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  canvas { display: block; width: 100%; height: 300px; }
  .sheet-note {
    margin-top: 8px;
    padding-top: 9px;
    border-top: 1px dashed rgba(92, 76, 58, 0.20);
    font-size: 13px;
    line-height: 1.72;
    color: #3a332c;
  }
  .sheet-note-tag { color: #a83825; font-weight: 600; margin-right: 4px; }

  .sheet-right {
    position: relative;
    border-left: 2px double rgba(92, 76, 58, 0.22);
    padding: 14px 18px 13px;
    background: #f5efe2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sol-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 7px;
    margin-bottom: 9px;
    border-bottom: 1px solid rgba(92, 76, 58, 0.14);
  }
  .sol-head h2 { margin: 0; font-size: 13.5px; font-weight: 700; color: #2b251f; }
  .sol-total { font-size: 12px; color: #7c6f60; }

  .sol-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .sol-step {
    padding: 6px 8px 6px 11px;
    border-left: 2px solid transparent;
    border-radius: 0 4px 4px 0;
    opacity: 0.52;
    cursor: pointer;
    transition: opacity 150ms ease, border-color 150ms ease, background 150ms ease;
  }
  .sol-step:hover { opacity: 0.85; }
  .sol-step[data-active="true"] {
    opacity: 1;
    border-left-color: #a83825;
    background: rgba(168, 56, 37, 0.05);
  }
  .sol-step-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 12px;
    color: #6f6254;
    margin-bottom: 3px;
  }
  .sol-step[data-active="true"] .sol-step-top { color: #2b251f; font-weight: 600; }
  .sol-eq { font-size: 13.5px; color: #25201b; line-height: 1.65; }

  .bet-box {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 46px;
    z-index: 4;
    padding: 11px 12px;
    background: #fbf7ef;
    border: 1px dashed rgba(168, 56, 37, 0.52);
    border-radius: 5px;
    box-shadow: 0 10px 26px rgba(44, 39, 34, 0.14);
  }
  .bet-box[hidden] { display: none; }
  .bet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: #a83825;
    margin-bottom: 6px;
  }
  .bet-skip { appearance: none; border: none; background: none; color: #7c6f60; font-size: 11.5px; cursor: pointer; padding: 0; }
  .bet-choice {
    display: block;
    width: 100%;
    text-align: left;
    appearance: none;
    background: transparent;
    border: 1px solid rgba(92, 76, 58, 0.22);
    border-radius: 3px;
    padding: 6px 8px;
    margin-top: 5px;
    font-size: 12px;
    color: #2b251f;
    cursor: pointer;
  }
  .bet-choice:hover { border-color: #a83825; background: rgba(168, 56, 37, 0.045); }
  .bet-fb { margin-top: 7px; font-size: 12px; line-height: 1.6; color: #a83825; }
  .bet-fb[hidden] { display: none; }

  .right-actions {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(92, 76, 58, 0.14);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .text-link {
    appearance: none;
    border: none;
    background: none;
    padding: 2px 0;
    font: 500 12px/1.2 inherit;
    color: #7c6f60;
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .text-link:hover { color: #26211c; border-bottom-color: rgba(44, 39, 34, 0.35); }
  .red-btn {
    appearance: none;
    border: 1px solid rgba(168, 56, 37, 0.45);
    background: transparent;
    color: #a83825;
    padding: 4px 10px;
    border-radius: 3px;
    font: 500 12px/1.2 inherit;
    cursor: pointer;
  }
  .red-btn:hover { background: rgba(168, 56, 37, 0.06); }
  .toast { font-size: 11.5px; color: #7c6f60; }

  .sheet-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 20px;
    background: #f9f5ec;
    border-top: 1px solid rgba(92, 76, 58, 0.16);
    font-size: 12px;
  }
  .foot-transport { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 220px; }
  .play-btn {
    appearance: none;
    border: 1px solid rgba(92, 76, 58, 0.34);
    background: #3d352d;
    color: #faf6ee;
    padding: 5px 12px;
    border-radius: 3px;
    font: 500 12px/1.2 inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .hairline-range {
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: rgba(92, 76, 58, 0.24);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }
  .hairline-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #a83825;
    cursor: pointer;
  }
  #timeline { flex: 1; }
  .clock { font-size: 11.5px; color: #7c6f60; white-space: nowrap; }
  .foot-params { display: flex; align-items: center; gap: 12px; color: #6b5f52; }
  .fn-tabs { display: inline-flex; align-items: center; gap: 8px; }
  .fn-tab {
    appearance: none;
    border: none;
    background: none;
    padding: 1px 0;
    font-size: 12.5px;
    color: #7c6f60;
    cursor: pointer;
    border-bottom: 1.5px solid transparent;
  }
  .fn-tab[aria-pressed="true"] { color: #a83825; border-bottom-color: #a83825; }
  .param-pair { display: inline-flex; align-items: center; gap: 6px; }
  .param-pair input[type="range"] { width: 78px; }
  .param-pair input[type="range"]::-webkit-slider-thumb { background: #7d5c46; }

  @media (max-width: 680px) {
    .sheet-grid { grid-template-columns: 1fr; }
    .sheet-right { border-left: none; border-top: 2px double rgba(92, 76, 58, 0.22); }
    .sheet-head { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header class="sheet-head">
    <h1 class="sheet-title serif">割线逼近切线与凹凸边界</h1>
    <div class="sheet-live" id="live-readout"></div>
  </header>

  <div class="sheet-grid">
    <div class="sheet-left">
      <canvas id="stage"></canvas>
      <div class="sheet-note serif" id="caption"></div>
    </div>

    <aside class="sheet-right serif">
      <div>
        <div class="sol-head">
          <h2>推导要点</h2>
          <span class="sol-total">微积分基础</span>
        </div>

        <ol class="sol-steps" id="rubric-steps">
          <li class="sol-step" data-jump="4" data-step="0" data-active="true">
            <div class="sol-step-top"><span>（一）割线斜率即平均变化率</span></div>
            <div class="sol-eq"><math display="inline"><msub><mi>k</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>f</mi><mrow><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><mi>h</mi><mo stretchy="false">)</mo></mrow><mo>−</mo><mi>f</mi><mrow><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">)</mo></mrow></mrow><mi>h</mi></mfrac></math></div>
          </li>
          <li class="sol-step" data-jump="18" data-step="1">
            <div class="sol-step-top"><span>（二）约去因子取极限得切线</span></div>
            <div class="sol-eq"><math display="inline"><munder><mi>lim</mi><mrow><mi>h</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mrow><msup><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>h</mi><mo stretchy="false">)</mo></mrow><mn>2</mn></msup><mo>−</mo><mn>1</mn></mrow><mi>h</mi></mfrac><mo>=</mo><mn>2</mn><mo>=</mo><msup><mi>f</mi><mo>′</mo></msup><mrow><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></math></div>
          </li>
          <li class="sol-step" data-jump="30" data-step="2">
            <div class="sol-step-top"><span>（三）二阶导保号托底切线放缩</span></div>
            <div class="sol-eq"><math display="inline"><msup><mi>f</mi><mo>″</mo></msup><mrow><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><mo>=</mo><msup><mi>e</mi><mi>x</mi></msup><mo>&gt;</mo><mn>0</mn><mo>⇒</mo><msup><mi>e</mi><mi>x</mi></msup><mo>≥</mo><mn>1</mn><mo>+</mo><mi>x</mi></math></div>
          </li>
          <li class="sol-step" data-jump="41" data-step="3">
            <div class="sol-step-top"><span>（四）拐点变号：切线穿过曲线</span></div>
            <div class="sol-eq"><math display="inline"><mi>f</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><mo>=</mo><msup><mi>t</mi><mn>3</mn></msup></math>，<math display="inline"><msup><mi>f</mi><mo>″</mo></msup><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><mo>=</mo><mn>6</mn><mi>t</mi></math> 在 <math display="inline"><mi>t</mi><mo>=</mo><mn>0</mn></math> 变号</div>
          </li>
        </ol>

        <div class="bet-box" id="bet-overlay" hidden>
          <div class="bet-head">
            <span>朱笔辨析 · 切线必在曲线同侧？</span>
            <button type="button" class="bet-skip" id="bet-skip">收起</button>
          </div>
          <button type="button" class="bet-choice" data-bet="wrong">甲：只要在切点相切，曲线就总在切线同一侧</button>
          <button type="button" class="bet-choice" data-bet="right">乙：须看 <math display="inline"><msup><mi>f</mi><mo>″</mo></msup></math> 是否保号，拐点处切线会直接穿过曲线</button>
          <div class="bet-fb" id="bet-feedback" hidden></div>
        </div>
      </div>

      <div class="right-actions">
        <button type="button" class="text-link" id="quote-btn">带入课堂提问 ↗</button>
        <button type="button" class="red-btn" id="open-bet-btn">朱笔辨析</button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </aside>
  </div>

  <footer class="sheet-foot">
    <div class="foot-transport">
      <button type="button" class="play-btn" id="play-btn">▶ 演示</button>
      <input type="range" class="hairline-range" id="timeline" min="0" max="48" step="0.05" value="4.2" aria-label="时间轴">
      <span class="clock mono" id="time-readout">00:04 / 00:48</span>
    </div>
    <div class="foot-params">
      <div class="fn-tabs" role="group" aria-label="切换函数">
        <button type="button" class="fn-tab" data-fn="quad" aria-pressed="true"><math display="inline"><msup><mi>x</mi><mn>2</mn></msup></math></button>
        <button type="button" class="fn-tab" data-fn="exp" aria-pressed="false"><math display="inline"><msup><mi>e</mi><mi>x</mi></msup></math></button>
        <button type="button" class="fn-tab" data-fn="cubic" aria-pressed="false"><math display="inline"><msup><mi>t</mi><mn>3</mn></msup></math></button>
      </div>
      <label class="param-pair">
        <math display="inline"><mi>h</mi></math>
        <input type="range" class="hairline-range" id="h-slider" data-param="h" min="-1.10" max="1.20" step="0.02" value="0.96">
      </label>
    </div>
  </footer>
</div>

<script>
(function () {
  var TOTAL = 48;
  var playing = false;
  var interactiveOverride = false;
  var t = 4.2;
  var manualFn = 'quad';
  var manualH = 0.96;
  var lastTs = 0;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var playBtn = document.getElementById('play-btn');
  var timeline = document.getElementById('timeline');
  var timeEl = document.getElementById('time-readout');
  var liveEl = document.getElementById('live-readout');
  var captionEl = document.getElementById('caption');
  var hSlider = document.getElementById('h-slider');
  var betOverlay = document.getElementById('bet-overlay');
  var betFeedback = document.getElementById('bet-feedback');
  var toastEl = document.getElementById('toast');
  var stepEls = Array.prototype.slice.call(document.querySelectorAll('#rubric-steps [data-step]'));
  var fnBtns = Array.prototype.slice.call(document.querySelectorAll('[data-fn]'));
  var betBtns = Array.prototype.slice.call(document.querySelectorAll('[data-bet]'));

  function M(s) { return '<math display="inline">' + s + '</math>'; }

  var FUNCS = {
    quad: {
      label: 'y = x²',
      mathHtml: M('<mi>y</mi><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup>'),
      x0: 1,
      f: function (x) { return x * x; },
      df: function (x) { return 2 * x; },
      domain: [-0.6, 2.7],
      range: [-0.4, 5.2]
    },
    exp: {
      label: 'y = eˣ',
      mathHtml: M('<mi>y</mi><mo>=</mo><msup><mi>e</mi><mi>x</mi></msup>'),
      x0: 0,
      f: function (x) { return Math.exp(x); },
      df: function (x) { return Math.exp(x); },
      domain: [-1.8, 1.8],
      range: [-0.6, 4.5]
    },
    cubic: {
      label: 'y = t³',
      mathHtml: M('<mi>y</mi><mo>=</mo><msup><mi>t</mi><mn>3</mn></msup>'),
      x0: 0,
      f: function (x) { return x * x * x; },
      df: function (x) { return 3 * x * x; },
      domain: [-1.7, 1.7],
      range: [-2.3, 2.3]
    }
  };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeInOut(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function formatTime(sec) {
    var s = Math.max(0, Math.floor(sec));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function computeState() {
    var sceneIdx = t < 12 ? 0 : t < 24 ? 1 : t < 36 ? 2 : 3;
    var fnKey = manualFn, h = manualH, showShading = false, noteHtml = '';

    if (!interactiveOverride) {
      if (sceneIdx === 0) {
        fnKey = 'quad';
        h = 1.15 - 0.35 * easeInOut(clamp(t / 12, 0, 1));
        noteHtml = '切线不能只凭单点画：先在 ' + M('<mi>A</mi><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow>') + ' 右侧取动点 ' + M('<mi>B</mi>') + '，割线斜率即为平均变化率。';
      } else if (sceneIdx === 1) {
        fnKey = 'quad';
        h = 0.80 - 0.76 * easeInOut(clamp((t - 12) / 12, 0, 1));
        noteHtml = '把 ' + M('<mi>h</mi>') + ' 推向 ' + M('<mn>0</mn>') + '，差商约去因子 ' + M('<mi>h</mi>') + ' 后割线斜率 ' + M('<mn>2</mn><mo>+</mo><mi>h</mi>') + ' 稳稳收敛到切线斜率 ' + M('<mn>2</mn>') + '。';
      } else if (sceneIdx === 2) {
        fnKey = 'exp';
        h = 0.90 - 0.84 * easeInOut(clamp((t - 24) / 12, 0, 1));
        showShading = true;
        noteHtml = '因二阶导 ' + M('<msup><mi>e</mi><mi>x</mi></msup><mo>&gt;</mo><mn>0</mn>') + ' 恒为正，朱红阴影始终位于切线 ' + M('<mi>y</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>x</mi>') + ' 上方。';
      } else {
        fnKey = 'cubic';
        h = 0.95 - 1.85 * easeInOut(clamp((t - 36) / 12, 0, 1));
        showShading = true;
        noteHtml = '拐点反例：' + M('<mi>y</mi><mo>=</mo><msup><mi>t</mi><mn>3</mn></msup>') + ' 在原点处水平切线 ' + M('<mi>y</mi><mo>=</mo><mn>0</mn>') + ' 直接穿过曲线，单侧放缩失效。';
      }
      manualFn = fnKey;
      manualH = h;
    } else {
      showShading = fnKey !== 'quad';
      noteHtml = fnKey === 'cubic'
        ? '来回拖动 ' + M('<mi>h</mi>') + ' 穿过 ' + M('<mn>0</mn>') + '，观察曲线从切线下方穿过切点跃到切线上方。'
        : '拖动 ' + M('<mi>h</mi>') + ' 逼近 ' + M('<mn>0</mn>') + '，对照割线斜率与切线斜率的实时逼近。';
    }

    var cfg = FUNCS[fnKey];
    var safeH = Math.abs(h) < 0.025 ? (h >= 0 ? 0.025 : -0.025) : h;
    var y0 = cfg.f(cfg.x0);
    var bx = cfg.x0 + safeH;
    var by = cfg.f(bx);
    return {
      sceneIdx: sceneIdx, fnKey: fnKey, cfg: cfg, h: safeH,
      x0: cfg.x0, y0: y0, bx: bx, by: by,
      secSlope: (by - y0) / safeH,
      tanSlope: cfg.df(cfg.x0),
      showShading: showShading,
      noteHtml: noteHtml
    };
  }

  function render() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var W = Math.max(260, Math.round(rect.width));
    var H = Math.max(220, Math.round(rect.height));
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var st = computeState();
    var cfg = st.cfg;
    var pad = { l: 38, r: 22, t: 18, b: 28 };
    var pw = W - pad.l - pad.r;
    var ph = H - pad.t - pad.b;
    function mx(x) { return pad.l + ((x - cfg.domain[0]) / (cfg.domain[1] - cfg.domain[0])) * pw; }
    function my(y) { return pad.t + ph - ((y - cfg.range[0]) / (cfg.range[1] - cfg.range[0])) * ph; }

    ctx.fillStyle = '#faf6ee';
    ctx.fillRect(0, 0, W, H);

    // Subtle coordinate grid
    ctx.strokeStyle = 'rgba(92, 76, 58, 0.08)';
    ctx.lineWidth = 1;
    for (var gx = Math.ceil(cfg.domain[0]); gx <= Math.floor(cfg.domain[1]); gx++) {
      ctx.beginPath(); ctx.moveTo(mx(gx), pad.t); ctx.lineTo(mx(gx), H - pad.b); ctx.stroke();
    }
    for (var gy = Math.ceil(cfg.range[0]); gy <= Math.floor(cfg.range[1]); gy++) {
      ctx.beginPath(); ctx.moveTo(pad.l, my(gy)); ctx.lineTo(W - pad.r, my(gy)); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = 'rgba(44, 39, 34, 0.36)';
    ctx.lineWidth = 1.1;
    if (cfg.range[0] <= 0 && cfg.range[1] >= 0) {
      ctx.beginPath(); ctx.moveTo(pad.l, my(0)); ctx.lineTo(W - pad.r, my(0)); ctx.stroke();
    }
    if (cfg.domain[0] <= 0 && cfg.domain[1] >= 0) {
      ctx.beginPath(); ctx.moveTo(mx(0), pad.t); ctx.lineTo(mx(0), H - pad.b); ctx.stroke();
    }

    // Convexity gap shading
    if (st.showShading) {
      ctx.save();
      ctx.beginPath();
      var N = 110;
      for (var i = 0; i <= N; i++) {
        var x = cfg.domain[0] + ((cfg.domain[1] - cfg.domain[0]) * i) / N;
        var y = clamp(cfg.f(x), cfg.range[0], cfg.range[1]);
        if (i === 0) ctx.moveTo(mx(x), my(y));
        else ctx.lineTo(mx(x), my(y));
      }
      for (var j = N; j >= 0; j--) {
        var x2 = cfg.domain[0] + ((cfg.domain[1] - cfg.domain[0]) * j) / N;
        var yt = clamp(st.y0 + st.tanSlope * (x2 - st.x0), cfg.range[0], cfg.range[1]);
        ctx.lineTo(mx(x2), my(yt));
      }
      ctx.closePath();
      ctx.fillStyle = st.fnKey === 'cubic' ? 'rgba(168, 56, 37, 0.10)' : 'rgba(125, 92, 70, 0.11)';
      ctx.fill();
      ctx.restore();
    }

    // Tangent line (dashed ink)
    ctx.save();
    ctx.strokeStyle = 'rgba(44, 39, 34, 0.50)';
    ctx.lineWidth = 1.3;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(mx(cfg.domain[0]), my(st.y0 + st.tanSlope * (cfg.domain[0] - st.x0)));
    ctx.lineTo(mx(cfg.domain[1]), my(st.y0 + st.tanSlope * (cfg.domain[1] - st.x0)));
    ctx.stroke();
    ctx.restore();

    // Curve
    ctx.save();
    ctx.strokeStyle = '#26211c';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for (var s = 0; s <= 150; s++) {
      var xc = cfg.domain[0] + ((cfg.domain[1] - cfg.domain[0]) * s) / 150;
      var yc = cfg.f(xc);
      if (yc < cfg.range[0] - 1 || yc > cfg.range[1] + 1) { started = false; continue; }
      if (!started) { ctx.moveTo(mx(xc), my(yc)); started = true; }
      else ctx.lineTo(mx(xc), my(yc));
    }
    ctx.stroke();
    ctx.restore();

    // Secant line (vermilion)
    ctx.save();
    ctx.strokeStyle = '#a83825';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(mx(cfg.domain[0]), my(st.y0 + st.secSlope * (cfg.domain[0] - st.x0)));
    ctx.lineTo(mx(cfg.domain[1]), my(st.y0 + st.secSlope * (cfg.domain[1] - st.x0)));
    ctx.stroke();
    ctx.restore();

    // Slope triangle (Δx, Δy)
    ctx.save();
    ctx.strokeStyle = 'rgba(168, 56, 37, 0.42)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(mx(st.x0), my(st.y0));
    ctx.lineTo(mx(st.bx), my(st.y0));
    ctx.lineTo(mx(st.bx), my(st.by));
    ctx.stroke();
    ctx.restore();

    // Points A and B
    function drawDot(x, y, r, fill) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
      ctx.strokeStyle = '#faf6ee'; ctx.lineWidth = 1.4; ctx.stroke();
    }
    drawDot(mx(st.x0), my(st.y0), 4.2, '#26211c');
    drawDot(mx(st.bx), my(st.by), 4.2, '#a83825');

    ctx.font = 'italic 13px "Times New Roman", Georgia, serif';
    ctx.fillStyle = '#26211c';
    ctx.fillText('A', mx(st.x0) - 16, my(st.y0) - 8);
    ctx.fillStyle = '#a83825';
    ctx.fillText('B', mx(st.bx) + (st.h >= 0 ? -16 : 9), my(st.by) - 8);

    // DOM updates
    liveEl.innerHTML =
      cfg.mathHtml +
      ' · ' + M('<mi>h</mi><mo>=</mo><mn>' + st.h.toFixed(2) + '</mn>') +
      ' · 割线 <strong>' + M('<mn>' + st.secSlope.toFixed(2) + '</mn>') + '</strong> / 切线 ' + M('<mn>' + st.tanSlope.toFixed(2) + '</mn>');

    captionEl.innerHTML = '<span class="sheet-note-tag">批注：</span>' + st.noteHtml;
    timeEl.textContent = formatTime(t) + ' / ' + formatTime(TOTAL);
    timeline.value = t.toFixed(2);
    hSlider.value = clamp(st.h, -1.10, 1.20).toFixed(2);
    playBtn.textContent = playing ? '❚❚ 暂停' : '▶ 演示';

    for (var fi = 0; fi < fnBtns.length; fi++) {
      fnBtns[fi].setAttribute('aria-pressed', fnBtns[fi].dataset.fn === st.fnKey ? 'true' : 'false');
    }
    for (var si = 0; si < stepEls.length; si++) {
      stepEls[si].setAttribute('data-active', si === st.sceneIdx ? 'true' : 'false');
    }

    if (window.notara && typeof window.notara.setState === 'function') {
      window.notara.setState({
        summary: '代码微课《割线逼近切线与凹凸边界》停在 ' + formatTime(t) + '（第 ' + (st.sceneIdx + 1) + ' 幕，' + cfg.label + '，h=' + st.h.toFixed(2) + '，割线斜率=' + st.secSlope.toFixed(2) + '，切线斜率=' + st.tanSlope.toFixed(2) + '）。',
        params: { timestamp: formatTime(t), scene: st.sceneIdx + 1, fn: cfg.label, h: Number(st.h.toFixed(2)), secantSlope: Number(st.secSlope.toFixed(2)), tangentSlope: Number(st.tanSlope.toFixed(2)) }
      }, { immediate: !playing });
    }
  }

  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.08, (ts - lastTs) / 1000);
    lastTs = ts;
    t += dt;
    if (t >= TOTAL) { t = TOTAL; playing = false; }
    render();
    if (playing) requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', function () {
    if (playing) {
      playing = false; interactiveOverride = true; render();
    } else {
      if (t >= TOTAL - 0.1) t = 0;
      betOverlay.hidden = true;
      interactiveOverride = false; playing = true; lastTs = 0;
      render(); requestAnimationFrame(tick);
    }
  });

  timeline.addEventListener('input', function () {
    t = Number(timeline.value) || 0;
    interactiveOverride = false;
    render();
  });

  stepEls.forEach(function (el) {
    el.addEventListener('click', function () {
      playing = false; interactiveOverride = false;
      t = Number(el.dataset.jump) || 0;
      betOverlay.hidden = true;
      render();
    });
  });

  fnBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      playing = false; interactiveOverride = true;
      manualFn = btn.dataset.fn || 'quad';
      render();
    });
  });

  hSlider.addEventListener('input', function () {
    playing = false; interactiveOverride = true;
    manualH = Number(hSlider.value) || 0.2;
    render();
  });

  document.getElementById('open-bet-btn').addEventListener('click', function () {
    playing = false;
    betOverlay.hidden = !betOverlay.hidden;
    betFeedback.hidden = true;
    render();
  });

  document.getElementById('bet-skip').addEventListener('click', function () {
    betOverlay.hidden = true;
  });

  betBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var wrong = btn.dataset.bet === 'wrong';
      playing = false; interactiveOverride = true;
      manualFn = 'cubic'; manualH = -0.65;
      betFeedback.hidden = false;
      betFeedback.innerHTML = wrong
        ? '<strong>朱笔反例：</strong>已切到 ' + M('<mi>y</mi><mo>=</mo><msup><mi>t</mi><mn>3</mn></msup>') + '，原点处切线 ' + M('<mi>y</mi><mo>=</mo><mn>0</mn>') + ' 直接穿过曲线！'
        : '<strong>判断准确：</strong>只有二阶导在区间内保号，切线放缩才单侧成立。';
      render();
    });
  });

  document.getElementById('quote-btn').addEventListener('click', function () {
    playing = false;
    var st = computeState();
    var msg = '我在代码微课《割线逼近切线与凹凸边界》第 ' + formatTime(t) + ' 暂停了（' + st.cfg.label + '，h=' + st.h.toFixed(2) + '，割线斜率 ' + st.secSlope.toFixed(2) + '，切线斜率 ' + st.tanSlope.toFixed(2) + '），请结合这一帧帮我检验理解。';
    if (window.notara && typeof window.notara.quoteState === 'function') {
      window.notara.quoteState({
        summary: msg,
        params: { timestamp: formatTime(t), fn: st.cfg.label, h: Number(st.h.toFixed(2)), secantSlope: Number(st.secSlope.toFixed(2)), tangentSlope: Number(st.tanSlope.toFixed(2)) }
      });
      toastEl.hidden = false; toastEl.textContent = '已带入课堂草稿。';
    } else {
      toastEl.hidden = false; toastEl.textContent = '已记录当前帧（' + st.cfg.label + ', h=' + st.h.toFixed(2) + '）。';
    }
    render();
  });

  if (window.notara && typeof window.notara.onSeek === 'function') {
    window.notara.onSeek(function (detail) {
      if (!detail || typeof detail !== 'object') return;
      playing = false;
      if (typeof detail.time === 'number' && isFinite(detail.time)) {
        t = clamp(detail.time, 0, TOTAL);
        interactiveOverride = false;
      }
      if (detail.params && typeof detail.params === 'object') {
        if (detail.params.fn && FUNCS[detail.params.fn]) { manualFn = detail.params.fn; interactiveOverride = true; }
        if (typeof detail.params.h === 'number') { manualH = clamp(detail.params.h, -1.10, 1.20); interactiveOverride = true; }
      }
      render();
    });
  }

  window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
