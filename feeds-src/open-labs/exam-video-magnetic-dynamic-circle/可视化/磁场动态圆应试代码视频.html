<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有界磁场动态圆 · 应试代码微课</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f6f1e6;
    color: #2c2722;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", Georgia, "Times New Roman", serif;
  }
  .mono {
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  math {
    font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", "Times New Roman", "Songti SC", serif;
    font-size: 1.04em;
    color: inherit;
  }
  math[display="inline"] { vertical-align: middle; }

  .sheet {
    width: 100%;
    background: #f6f1e6;
    color: #2c2722;
    overflow: hidden;
  }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 20px;
    background: #f9f5ec;
    border-bottom: 2px double rgba(92, 76, 58, 0.24);
  }
  .sheet-title {
    margin: 0;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #26211c;
  }
  .sheet-live {
    font-size: 13px;
    color: #6b5f52;
    white-space: nowrap;
  }
  .sheet-live strong {
    color: #a83825;
    font-weight: 600;
  }

  .sheet-grid {
    display: grid;
    grid-template-columns: 1.38fr 1fr;
    min-height: 368px;
  }
  .sheet-left {
    padding: 12px 18px 14px;
    background: #faf6ee;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  canvas {
    display: block;
    width: 100%;
    height: 300px;
  }
  .sheet-note {
    margin-top: 8px;
    padding-top: 9px;
    border-top: 1px dashed rgba(92, 76, 58, 0.20);
    font-size: 13px;
    line-height: 1.72;
    color: #3a332c;
  }
  .sheet-note-tag {
    color: #a83825;
    font-weight: 600;
    margin-right: 4px;
  }

  .sheet-right {
    position: relative;
    border-left: 2px double rgba(92, 76, 58, 0.22);
    padding: 14px 18px 13px;
    background: #f5efe2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sol-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 7px;
    margin-bottom: 9px;
    border-bottom: 1px solid rgba(92, 76, 58, 0.14);
  }
  .sol-head h2 {
    margin: 0;
    font-size: 13.5px;
    font-weight: 700;
    color: #2b251f;
  }
  .sol-total {
    font-size: 12px;
    color: #a83825;
    font-weight: 600;
  }

  .sol-steps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sol-step {
    padding: 6px 8px 6px 11px;
    border-left: 2px solid transparent;
    border-radius: 0 4px 4px 0;
    opacity: 0.52;
    cursor: pointer;
    transition: opacity 150ms ease, border-color 150ms ease, background 150ms ease;
  }
  .sol-step:hover { opacity: 0.85; }
  .sol-step[data-active="true"] {
    opacity: 1;
    border-left-color: #a83825;
    background: rgba(168, 56, 37, 0.05);
  }
  .sol-step-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: #6f6254;
    margin-bottom: 3px;
  }
  .sol-step[data-active="true"] .sol-step-top {
    color: #2b251f;
    font-weight: 600;
  }
  .sol-pts {
    color: #a83825;
    font-size: 11.5px;
    font-weight: 600;
  }
  .sol-eq {
    font-size: 13.5px;
    color: #25201b;
    line-height: 1.65;
  }

  .bet-box {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 46px;
    z-index: 4;
    padding: 11px 12px;
    background: #fbf7ef;
    border: 1px dashed rgba(168, 56, 37, 0.52);
    border-radius: 5px;
    box-shadow: 0 10px 26px rgba(44, 39, 34, 0.14);
  }
  .bet-box[hidden] { display: none; }
  .bet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: #a83825;
    margin-bottom: 6px;
  }
  .bet-skip {
    appearance: none;
    border: none;
    background: none;
    color: #7c6f60;
    font-size: 11.5px;
    cursor: pointer;
    padding: 0;
  }
  .bet-skip:hover { color: #2b251f; }
  .bet-choice {
    display: block;
    width: 100%;
    text-align: left;
    appearance: none;
    background: transparent;
    border: 1px solid rgba(92, 76, 58, 0.22);
    border-radius: 3px;
    padding: 6px 8px;
    margin-top: 5px;
    font-size: 12.5px;
    color: #2b251f;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .bet-choice:hover {
    border-color: #a83825;
    background: rgba(168, 56, 37, 0.045);
  }
  .bet-fb {
    margin-top: 7px;
    font-size: 12px;
    line-height: 1.6;
    color: #a83825;
  }
  .bet-fb[hidden] { display: none; }

  .right-actions {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(92, 76, 58, 0.14);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .text-link {
    appearance: none;
    border: none;
    background: none;
    padding: 2px 0;
    font: 500 12px/1.2 inherit;
    color: #7c6f60;
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .text-link:hover {
    color: #26211c;
    border-bottom-color: rgba(44, 39, 34, 0.35);
  }
  .red-btn {
    appearance: none;
    border: 1px solid rgba(168, 56, 37, 0.45);
    background: transparent;
    color: #a83825;
    padding: 4px 10px;
    border-radius: 3px;
    font: 500 12px/1.2 inherit;
    cursor: pointer;
  }
  .red-btn:hover { background: rgba(168, 56, 37, 0.06); }
  .toast {
    font-size: 11.5px;
    color: #7c6f60;
    min-height: 1em;
  }

  .sheet-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 20px;
    background: #f9f5ec;
    border-top: 1px solid rgba(92, 76, 58, 0.16);
    font-size: 12px;
  }
  .foot-transport {
    display: flex;
    align-items: center;
    gap: 11px;
    flex: 1;
    min-width: 240px;
  }
  .play-btn {
    appearance: none;
    border: 1px solid rgba(92, 76, 58, 0.34);
    background: #3d352d;
    color: #faf6ee;
    padding: 5px 12px;
    border-radius: 3px;
    font: 500 12px/1.2 inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .play-btn:hover { background: #2c2620; }
  .hairline-range {
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: rgba(92, 76, 58, 0.24);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }
  .hairline-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #a83825;
    cursor: pointer;
  }
  #timeline { flex: 1; }
  .clock {
    font-size: 11.5px;
    color: #7c6f60;
    white-space: nowrap;
  }
  .foot-params {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #6b5f52;
  }
  .param-pair {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .param-pair input[type="range"] {
    width: 74px;
  }
  .param-pair input[type="range"]::-webkit-slider-thumb {
    background: #7d5c46;
  }

  @media (max-width: 680px) {
    .sheet-grid { grid-template-columns: 1fr; }
    .sheet-right { border-left: none; border-top: 2px double rgba(92, 76, 58, 0.22); }
    .sheet-head { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header class="sheet-head">
    <h1 class="sheet-title serif">有界匀强磁场动态圆</h1>
    <div class="sheet-live" id="live-readout"></div>
  </header>

  <div class="sheet-grid">
    <div class="sheet-left">
      <canvas id="stage"></canvas>
      <div class="sheet-note serif" id="caption"></div>
    </div>

    <aside class="sheet-right serif">
      <div>
        <div class="sol-head">
          <h2>参考解答</h2>
          <span class="sol-total mono">9 分</span>
        </div>

        <ol class="sol-steps" id="rubric-steps">
          <li class="sol-step" data-jump="4" data-step="0">
            <div class="sol-step-top"><span>（一）洛伦兹力提供向心力</span><span class="sol-pts mono">+2</span></div>
            <div class="sol-eq"><math display="inline"><mi>q</mi><mi>v</mi><mi>B</mi><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac></math>，得 <math display="inline"><mi>R</mi><mo>=</mo><mfrac><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mi>q</mi><mi>B</mi></mrow></mfrac></math></div>
          </li>
          <li class="sol-step" data-jump="18" data-step="1" data-active="true">
            <div class="sol-step-top"><span>（二）右边界相切临界</span><span class="sol-pts mono">+3</span></div>
            <div class="sol-eq"><math display="inline"><mi>R</mi><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>sin</mi><mo>&#x2061;</mo><mn>30</mn><mo>°</mo><mo stretchy="false">)</mo></mrow><mo>=</mo><mi>d</mi><mo>⇒</mo><msub><mi>R</mi><mi>c</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>d</mi></mrow><mn>3</mn></mfrac></math></div>
          </li>
          <li class="sol-step" data-jump="29" data-step="2">
            <div class="sol-step-top"><span>（三）穿界运动时间腰斩</span><span class="sol-pts mono">+2</span></div>
            <div class="sol-eq"><math display="inline"><mi>R</mi><mo>&lt;</mo><msub><mi>R</mi><mi>c</mi></msub></math> 时 <math display="inline"><mi>t</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>T</mi></mrow><mn>3</mn></mfrac></math>；穿界骤降为 <math display="inline"><mfrac><mi>T</mi><mn>3</mn></mfrac></math></div>
          </li>
          <li class="sol-step" data-jump="42" data-step="3">
            <div class="sol-step-top"><span>（四）旋转圆右界亮带</span><span class="sol-pts mono">+2</span></div>
            <div class="sol-eq"><math display="inline"><mrow><mo stretchy="false">|</mo><mi>y</mi><mo stretchy="false">|</mo></mrow><mo>≤</mo><msqrt><mrow><mn>2</mn><mi>R</mi><mi>d</mi><mo>−</mo><msup><mi>d</mi><mn>2</mn></msup></mrow></msqrt><mo>≈</mo><mn>0.71</mn><mi>d</mi></math></div>
          </li>
        </ol>

        <div class="bet-box" id="bet-overlay" hidden>
          <div class="bet-head">
            <span>朱笔点检 · 00:18</span>
            <button type="button" class="bet-skip" id="bet-skip">继续 ▸</button>
          </div>
          <button type="button" class="bet-choice" data-bet="wrong">甲：<math display="inline"><mn>2</mn><mi>R</mi><mo>=</mo><mi>d</mi><mo>⇒</mo><mi>R</mi><mo>=</mo><mfrac><mi>d</mi><mn>2</mn></mfrac></math></button>
          <button type="button" class="bet-choice" data-bet="right">乙：<math display="inline"><mi>R</mi><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>sin</mi><mo>&#x2061;</mo><mn>30</mn><mo>°</mo><mo stretchy="false">)</mo></mrow><mo>=</mo><mi>d</mi><mo>⇒</mo><msub><mi>R</mi><mi>c</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>d</mi></mrow><mn>3</mn></mfrac></math></button>
          <div class="bet-fb" id="bet-feedback" hidden></div>
        </div>
      </div>

      <div class="right-actions">
        <button type="button" class="text-link" id="quote-btn">带入课堂提问 ↗</button>
        <button type="button" class="red-btn" id="open-bet-btn">朱笔押注</button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </aside>
  </div>

  <footer class="sheet-foot">
    <div class="foot-transport">
      <button type="button" class="play-btn" id="play-btn">▶ 演示</button>
      <input type="range" class="hairline-range" id="timeline" min="0" max="48" step="0.05" value="18.0" aria-label="时间轴">
      <span class="clock mono" id="time-readout">00:18 / 00:48</span>
    </div>
    <div class="foot-params">
      <label class="param-pair">
        <math display="inline"><mi>R</mi><mo>/</mo><mi>d</mi></math>
        <input type="range" class="hairline-range" id="r-slider" data-param="R_over_d" min="0.28" max="1.20" step="0.01" value="0.67">
      </label>
      <label class="param-pair">
        <math display="inline"><mi>α</mi></math>
        <input type="range" class="hairline-range" id="a-slider" data-param="alpha_deg" min="-84" max="20" step="1" value="-30">
      </label>
    </div>
  </footer>
</div>

<script>
(function () {
  var TOTAL = 48;
  var playing = false;
  var interactiveOverride = false;
  var betFiredDuringPlay = false;
  var showWrongGap = false;
  var betResult = '';
  var t = 18.0;
  var manualModel = 'scale';
  var manualR = 2 / 3;
  var manualAlpha = -30;
  var lastTs = 0;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var playBtn = document.getElementById('play-btn');
  var timeline = document.getElementById('timeline');
  var timeEl = document.getElementById('time-readout');
  var liveEl = document.getElementById('live-readout');
  var captionEl = document.getElementById('caption');
  var rSlider = document.getElementById('r-slider');
  var aSlider = document.getElementById('a-slider');
  var betOverlay = document.getElementById('bet-overlay');
  var betFeedback = document.getElementById('bet-feedback');
  var betSkip = document.getElementById('bet-skip');
  var toastEl = document.getElementById('toast');
  var stepEls = Array.prototype.slice.call(document.querySelectorAll('#rubric-steps [data-step]'));
  var betBtns = Array.prototype.slice.call(document.querySelectorAll('[data-bet]'));

  function M(s) { return '<math display="inline">' + s + '</math>'; }
  function frac(a, b) { return '<mfrac><mrow>' + a + '</mrow><mrow>' + b + '</mrow></mfrac>'; }
  var F_RC = M('<msub><mi>R</mi><mi>c</mi></msub>');
  var F_2D3 = M(frac('<mn>2</mn><mi>d</mi>', '<mn>3</mn>'));
  var F_2T3 = M(frac('<mn>2</mn><mi>T</mi>', '<mn>3</mn>'));
  var F_T3 = M(frac('<mi>T</mi>', '<mn>3</mn>'));

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeInOut(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function formatTime(sec) {
    var s = Math.max(0, Math.floor(sec));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function solveTrajectory(R, alphaDeg) {
    var rad = (alphaDeg * Math.PI) / 180;
    var xc = -R * Math.sin(rad);
    var yc = R * Math.cos(rad);
    var xmax = xc + R;
    var phi0 = Math.atan2(-yc, -xc);
    var hitsRight = xmax > 1.0005;
    var isTangent = Math.abs(xmax - 1.0) <= 0.015;
    var phiOut, dPhi, exitX, exitY;

    if (hitsRight) {
      var cosVal = clamp((1.0 - xc) / R, -1, 1);
      var a1 = Math.acos(cosVal);
      var cands = [a1, -a1].map(function (a) {
        var ang = a;
        while (ang <= phi0 + 1e-4) ang += Math.PI * 2;
        return ang;
      });
      phiOut = Math.min(cands[0], cands[1]);
      dPhi = phiOut - phi0;
      exitX = 1.0;
      exitY = yc + R * Math.sin(phiOut);
    } else {
      var cosL = clamp(-xc / R, -1, 1);
      var c1 = Math.acos(cosL);
      var best = Infinity;
      [c1, -c1].forEach(function (a) {
        var ang = a;
        while (ang <= phi0 + 0.05) ang += Math.PI * 2;
        if (ang < best) best = ang;
      });
      phiOut = best;
      dPhi = phiOut - phi0;
      exitX = 0.0;
      exitY = yc + R * Math.sin(phiOut);
    }
    return {
      R: R, alphaDeg: alphaDeg, xc: xc, yc: yc, xmax: xmax,
      phi0: phi0, phiOut: phiOut, dPhi: dPhi,
      degSweep: (dPhi * 180) / Math.PI,
      timeT: dPhi / (Math.PI * 2),
      hitsRight: hitsRight, isTangent: isTangent,
      exitX: exitX, exitY: exitY
    };
  }

  function computeState() {
    var sceneIdx = t < 12 ? 0 : t < 24 ? 1 : t < 36 ? 2 : 3;
    var model = manualModel, R = manualR, alpha = manualAlpha;
    var noteHtml = '';

    if (!interactiveOverride) {
      if (sceneIdx === 0) {
        model = 'scale'; alpha = -30;
        R = 0.34 + 0.28 * easeInOut(clamp(t / 12, 0, 1));
        noteHtml = '方向锁在 ' + M('<mo>−</mo><mn>30</mn><mo>°</mo>') + ' 增大速率，只要 ' + M('<mi>R</mi><mo>&lt;</mo>' + frac('<mn>2</mn><mi>d</mi>', '<mn>3</mn>')) + '，粒子全折返左界，用时恒为 ' + F_2T3 + '。';
      } else if (sceneIdx === 1) {
        model = 'scale'; alpha = -30;
        R = 0.50 + (2 / 3 - 0.50) * easeInOut(clamp((t - 12) / 6, 0, 1));
        noteHtml = '斜射不能套 ' + M('<mn>2</mn><mi>R</mi><mo>=</mo><mi>d</mi>') + '：圆心横距 ' + M('<mi>R</mi><mi>sin</mi><mo>&#x2061;</mo><mn>30</mn><mo>°</mo>') + ' 加半径 ' + M('<mi>R</mi>') + ' 等于 ' + M('<mi>d</mi>') + '，故 ' + F_RC + ' = ' + F_2D3 + '。';
      } else if (sceneIdx === 2) {
        model = 'scale'; alpha = -30;
        R = 0.65 + 0.46 * easeInOut(clamp((t - 24) / 12, 0, 1));
        noteHtml = M('<mi>R</mi>') + ' 刚跨过 ' + F_2D3 + ' 即穿出右界，圆心角从 ' + M('<mn>240</mn><mo>°</mo>') + ' 跳至 ' + M('<mn>120</mn><mo>°</mo>') + '，用时由 ' + F_2T3 + ' 瞬间腰斩。';
      } else {
        model = 'rotate'; R = 0.75;
        alpha = -82 + 64 * easeInOut(clamp((t - 36) / 12, 0, 1));
        noteHtml = '定半径 ' + M('<mi>R</mi><mo>=</mo><mn>0.75</mn><mi>d</mi>') + ' 旋转入射角，右界朱红亮带覆盖 ' + M('<mo stretchy="false">[</mo><mo>−</mo><mn>0.71</mn><mi>d</mi><mo>,</mo><mo>+</mo><mn>0.71</mn><mi>d</mi><mo stretchy="false">]</mo>') + '。';
      }
      manualModel = model; manualR = R; manualAlpha = alpha;
    } else if (showWrongGap) {
      noteHtml = '按 ' + M('<mn>2</mn><mi>R</mi><mo>=</mo><mi>d</mi>') + ' 画出的圆最远只到 ' + M('<mn>0.75</mn><mi>d</mi>') + '，距右界仍空出 ' + M('<mn>0.25</mn><mi>d</mi>') + '，并未相切。';
    } else if (model === 'scale') {
      noteHtml = '把 ' + M('<mi>R</mi><mo>/</mo><mi>d</mi>') + ' 拖过 ' + F_2D3 + '，直接观察偏转角与用时从 ' + F_2T3 + ' 骤降至 ' + F_T3 + '。';
    } else {
      noteHtml = '定半径旋转 ' + M('<mi>α</mi>') + '：拖到 ' + M('<mo>−</mo><mn>19</mn><mo>°</mo>') + ' 附近即擦过右界最高受击点。';
    }

    return { sceneIdx: sceneIdx, model: model, traj: solveTrajectory(R, alpha), noteHtml: noteHtml };
  }

  function drawMathSub(base, sub, x, y, size, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = 'italic ' + size + 'px "Times New Roman", Georgia, serif';
    ctx.fillText(base, x, y);
    var w = ctx.measureText(base).width;
    if (sub) {
      ctx.font = Math.round(size * 0.72) + 'px "Times New Roman", Georgia, serif';
      ctx.fillText(sub, x + w + 0.5, y + size * 0.24);
    }
    ctx.restore();
  }

  function drawArrowHead(x, y, angle, len, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - len * Math.cos(angle - 0.36), y - len * Math.sin(angle - 0.36));
    ctx.lineTo(x - len * Math.cos(angle + 0.36), y - len * Math.sin(angle + 0.36));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function render() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var W = Math.max(260, Math.round(rect.width));
    var H = Math.max(220, Math.round(rect.height));
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var st = computeState();
    var tr = st.traj;

    ctx.fillStyle = '#faf6ee';
    ctx.fillRect(0, 0, W, H);

    var scale = Math.min(W * 0.42, H * 0.385);
    var ox = (W - scale) * 0.48;
    var oy = H * 0.65;
    function mx(x) { return ox + x * scale; }
    function my(y) { return oy - y * scale; }

    var fieldTop = 30;
    var fieldBot = H - 14;

    // Field strip [0, d]
    ctx.fillStyle = 'rgba(125, 92, 70, 0.032)';
    ctx.fillRect(mx(0), fieldTop, scale, fieldBot - fieldTop);

    ctx.strokeStyle = 'rgba(92, 76, 58, 0.21)';
    ctx.lineWidth = 1;
    for (var ci = 0; ci < 5; ci++) {
      for (var ri = 0; ri < 6; ri++) {
        var gx = mx((ci + 0.5) / 5);
        var gy = fieldTop + 16 + (ri / 5) * (fieldBot - fieldTop - 30);
        ctx.beginPath();
        ctx.moveTo(gx - 3, gy - 3); ctx.lineTo(gx + 3, gy + 3);
        ctx.moveTo(gx + 3, gy - 3); ctx.lineTo(gx - 3, gy + 3);
        ctx.stroke();
      }
    }

    // Left solid boundary, right dashed boundary
    ctx.strokeStyle = 'rgba(44, 39, 34, 0.54)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(mx(0), fieldTop); ctx.lineTo(mx(0), fieldBot);
    ctx.stroke();

    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(mx(1), fieldTop); ctx.lineTo(mx(1), fieldBot);
    ctx.stroke();
    ctx.setLineDash([]);

    // Dimension d cleanly above fieldTop
    var dimY = fieldTop - 10;
    ctx.strokeStyle = '#7c6f60';
    ctx.lineWidth = 0.85;
    ctx.beginPath();
    ctx.moveTo(mx(0), dimY - 3); ctx.lineTo(mx(0), dimY + 3);
    ctx.moveTo(mx(1), dimY - 3); ctx.lineTo(mx(1), dimY + 3);
    ctx.moveTo(mx(0), dimY); ctx.lineTo(mx(1), dimY);
    ctx.stroke();
    drawMathSub('d', '', mx(0.5) - 4, dimY - 4, 13, '#7c6f60');

    // Rotating circle right-boundary bright band
    if (st.model === 'rotate' && tr.R >= 0.5) {
      var yBand = Math.sqrt(Math.max(0, 2 * tr.R - 1));
      ctx.save();
      ctx.strokeStyle = 'rgba(168, 56, 37, 0.56)';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mx(1), my(yBand));
      ctx.lineTo(mx(1), my(-yBand));
      ctx.stroke();
      ctx.restore();
    }

    // Faint compass parent circle
    ctx.save();
    ctx.strokeStyle = 'rgba(92, 76, 58, 0.24)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.arc(mx(tr.xc), my(tr.yc), tr.R * scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Critical geometric right-triangle
    if (st.model === 'scale') {
      ctx.save();
      ctx.fillStyle = 'rgba(168, 56, 37, 0.065)';
      ctx.beginPath();
      ctx.moveTo(mx(0), my(0));
      ctx.lineTo(mx(tr.xc), my(tr.yc));
      ctx.lineTo(mx(0), my(tr.yc));
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(168, 56, 37, 0.55)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(mx(0), my(0));
      ctx.lineTo(mx(tr.xc), my(tr.yc));
      ctx.lineTo(mx(0), my(tr.yc));
      ctx.stroke();

      var sq = 6;
      ctx.beginPath();
      ctx.moveTo(mx(0) + sq, my(tr.yc));
      ctx.lineTo(mx(0) + sq, my(tr.yc) + sq);
      ctx.lineTo(mx(0), my(tr.yc) + sq);
      ctx.stroke();

      ctx.strokeStyle = tr.isTangent ? '#a83825' : 'rgba(168, 56, 37, 0.55)';
      ctx.lineWidth = tr.isTangent ? 1.5 : 1.1;
      ctx.beginPath();
      ctx.moveTo(mx(tr.xc), my(tr.yc));
      ctx.lineTo(mx(tr.xmax), my(tr.yc));
      ctx.stroke();

      if (tr.xc * scale > 24) {
        ctx.fillStyle = '#a83825';
        ctx.font = 'italic 11.5px "Times New Roman", Georgia, serif';
        ctx.fillText('R sin 30°', mx(tr.xc * 0.5) - 21, my(tr.yc) - 6);
      }
      ctx.fillStyle = tr.isTangent ? '#a83825' : '#7c6f60';
      ctx.font = 'italic 12.5px "Times New Roman", Georgia, serif';
      ctx.fillText('R', mx(tr.xc + tr.R * 0.5) - 4, my(tr.yc) - 6);
      ctx.restore();
    }

    if (showWrongGap && tr.xmax < 0.98) {
      ctx.save();
      ctx.strokeStyle = '#a83825';
      ctx.lineWidth = 1.6;
      var gyGap = my(tr.yc);
      ctx.beginPath();
      ctx.moveTo(mx(tr.xmax) + 2, gyGap);
      ctx.lineTo(mx(1) - 2, gyGap);
      ctx.stroke();
      ctx.fillStyle = '#a83825';
      ctx.font = '600 11px -apple-system, "PingFang SC", sans-serif';
      ctx.fillText('空档 0.25d', mx((tr.xmax + 1) / 2) - 26, gyGap + 16);
      ctx.restore();
    }

    // Actual trajectory arc
    ctx.save();
    ctx.strokeStyle = '#26211c';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var s = 0; s <= 96; s++) {
      var phi = tr.phi0 + (tr.dPhi * s) / 96;
      var px = mx(tr.xc + tr.R * Math.cos(phi));
      var py = my(tr.yc + tr.R * Math.sin(phi));
      if (s === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // Entry velocity v0
    var vLen = 34;
    var rad = (tr.alphaDeg * Math.PI) / 180;
    var vxEnd = mx(0) + vLen * Math.cos(rad);
    var vyEnd = my(0) - vLen * Math.sin(rad);
    ctx.strokeStyle = '#a83825';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(mx(0), my(0));
    ctx.lineTo(vxEnd, vyEnd);
    ctx.stroke();
    drawArrowHead(vxEnd, vyEnd, Math.atan2(vyEnd - my(0), vxEnd - mx(0)), 7, '#a83825');
    drawMathSub('v', '0', vxEnd + 4, vyEnd + 4, 13, '#a83825');

    function drawDot(x, y, r, fill, ring) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      if (ring) {
        ctx.strokeStyle = ring;
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
    }
    drawDot(mx(0), my(0), 3.3, '#26211c');
    drawMathSub('O', '', mx(0) - 16, my(0) + 4, 13, '#26211c');

    drawDot(mx(tr.xc), my(tr.yc), 3.1, '#a83825');
    drawMathSub("O′", '', mx(tr.xc) + 6, my(tr.yc) + 13, 12.5, '#a83825');

    drawDot(mx(tr.exitX), my(tr.exitY), 4.1, '#a83825', '#faf6ee');

    if (tr.isTangent) {
      ctx.save();
      ctx.strokeStyle = '#a83825';
      ctx.lineWidth = 1.25;
      ctx.beginPath();
      ctx.arc(mx(1), my(tr.yc), 7.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // DOM updates
    var rMath = Math.abs(tr.R - 2 / 3) < 0.015 ? F_2D3 : M('<mn>' + tr.R.toFixed(2) + '</mn><mi>d</mi>');
    var timeMath = Math.abs(tr.timeT - 2 / 3) < 0.02
      ? F_2T3
      : Math.abs(tr.timeT - 1 / 3) < 0.02
        ? F_T3
        : M('<mn>' + tr.timeT.toFixed(2) + '</mn><mi>T</mi>');

    liveEl.innerHTML =
      M('<mi>R</mi><mo>=</mo>') + rMath +
      ' · ' + M('<mi>α</mi><mo>=</mo><mn>' + Math.round(tr.alphaDeg) + '</mn><mo>°</mo>') +
      ' · ' + M('<mi>Δ</mi><mi>t</mi><mo>=</mo>') + '<strong>' + timeMath + '</strong>';

    captionEl.innerHTML = '<span class="sheet-note-tag">批注：</span>' + st.noteHtml;
    timeEl.textContent = formatTime(t) + ' / ' + formatTime(TOTAL);
    timeline.value = t.toFixed(2);
    rSlider.value = clamp(tr.R, 0.28, 1.20).toFixed(2);
    aSlider.value = Math.round(clamp(tr.alphaDeg, -84, 20));
    playBtn.textContent = playing ? '❚❚ 暂停' : '▶ 演示';

    for (var i = 0; i < stepEls.length; i++) {
      stepEls[i].setAttribute('data-active', i === st.sceneIdx ? 'true' : 'false');
    }

    if (window.notara && typeof window.notara.setState === 'function') {
      var betNote = betResult === 'wrong'
        ? '，学生在红笔押注中误选 2R=d（已标出 0.25d 缺口）'
        : betResult === 'right'
          ? '，学生在红笔押注中选对 R(1+sin30°)=d'
          : '';
      window.notara.setState({
        summary: '高考物理应试微课《有界磁场动态圆》停在 ' + formatTime(t) + '（第 ' + (st.sceneIdx + 1) + ' 幕，' + (st.model === 'scale' ? '放缩圆' : '旋转圆') + '，R=' + tr.R.toFixed(2) + 'd，α=' + Math.round(tr.alphaDeg) + '°，偏转角=' + Math.round(tr.degSweep) + '°，用时=' + tr.timeT.toFixed(2) + 'T' + betNote + '）。',
        params: {
          timestamp: formatTime(t),
          scene: st.sceneIdx + 1,
          model: st.model,
          R_over_d: Number(tr.R.toFixed(2)),
          alphaDeg: Math.round(tr.alphaDeg),
          deflectionDeg: Math.round(tr.degSweep),
          betResult: betResult || 'none'
        }
      }, { immediate: !playing });
    }
  }

  function showBetCheckpoint() {
    playing = false;
    betOverlay.hidden = false;
    betFeedback.hidden = true;
    render();
  }

  if (window.notara && typeof window.notara.onSeek === 'function') {
    window.notara.onSeek(function (detail) {
      if (!detail || typeof detail !== 'object') return;
      playing = false;
      betOverlay.hidden = true;
      showWrongGap = false;
      if (typeof detail.time === 'number' && isFinite(detail.time)) {
        t = clamp(detail.time, 0, TOTAL);
        interactiveOverride = false;
      }
      if (detail.params && typeof detail.params === 'object') {
        if (detail.params.model === 'scale' || detail.params.model === 'rotate') {
          manualModel = detail.params.model;
          interactiveOverride = true;
        }
        if (typeof detail.params.R_over_d === 'number') {
          manualR = clamp(detail.params.R_over_d, 0.28, 1.20);
          interactiveOverride = true;
        }
        if (typeof detail.params.alphaDeg === 'number') {
          manualAlpha = clamp(detail.params.alphaDeg, -84, 20);
          interactiveOverride = true;
        }
      }
      render();
    });
  }

  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    var prevT = t;
    var dt = Math.min(0.08, (ts - lastTs) / 1000);
    lastTs = ts;
    t += dt;
    if (!betFiredDuringPlay && prevT < 18.0 && t >= 18.0) {
      t = 18.0;
      betFiredDuringPlay = true;
      showBetCheckpoint();
      return;
    }
    if (t >= TOTAL) { t = TOTAL; playing = false; }
    render();
    if (playing) requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', function () {
    if (playing) {
      playing = false;
      interactiveOverride = true;
      render();
    } else {
      betOverlay.hidden = true;
      showWrongGap = false;
      if (t >= TOTAL - 0.1) { t = 0; betFiredDuringPlay = false; }
      interactiveOverride = false;
      playing = true;
      lastTs = 0;
      render();
      requestAnimationFrame(tick);
    }
  });

  timeline.addEventListener('input', function () {
    t = Number(timeline.value) || 0;
    betOverlay.hidden = true;
    showWrongGap = false;
    interactiveOverride = false;
    if (t < 17) betFiredDuringPlay = false;
    render();
  });

  stepEls.forEach(function (el) {
    el.addEventListener('click', function () {
      playing = false;
      showWrongGap = false;
      interactiveOverride = false;
      t = Number(el.dataset.jump) || 0;
      betOverlay.hidden = true;
      render();
    });
  });

  rSlider.addEventListener('input', function () {
    playing = false;
    betOverlay.hidden = true;
    showWrongGap = false;
    interactiveOverride = true;
    manualModel = 'scale';
    manualR = Number(rSlider.value) || 0.67;
    render();
  });

  aSlider.addEventListener('input', function () {
    playing = false;
    betOverlay.hidden = true;
    showWrongGap = false;
    interactiveOverride = true;
    manualModel = 'rotate';
    manualAlpha = Number(aSlider.value) || -30;
    render();
  });

  document.getElementById('open-bet-btn').addEventListener('click', function () {
    t = 18.0;
    interactiveOverride = false;
    showWrongGap = false;
    showBetCheckpoint();
  });

  betSkip.addEventListener('click', function () {
    betOverlay.hidden = true;
    showWrongGap = false;
    interactiveOverride = false;
    if (t < 24) t = 24.0;
    playing = true;
    lastTs = 0;
    render();
    requestAnimationFrame(tick);
  });

  betBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var ans = btn.dataset.bet;
      betResult = ans === 'wrong' ? 'wrong' : 'right';
      betFeedback.hidden = false;
      interactiveOverride = true;
      manualModel = 'scale';
      manualAlpha = -30;
      if (ans === 'wrong') {
        manualR = 0.50;
        showWrongGap = true;
        betFeedback.innerHTML = '<strong>朱笔 −6 分：</strong>' + M('<mi>R</mi><mo>=</mo>' + frac('<mi>d</mi>', '<mn>2</mn>')) + ' 最远只到 ' + M('<mn>0.75</mn><mi>d</mi>') + '，空档 ' + M('<mn>0.25</mn><mi>d</mi>') + ' 未相切。';
      } else {
        manualR = 2 / 3;
        showWrongGap = false;
        betFeedback.innerHTML = '<strong>拿下 +3 分：</strong>先找圆心横距 ' + M('<mi>R</mi><mi>sin</mi><mo>&#x2061;</mo><mn>30</mn><mo>°</mo>') + '，再得 ' + F_RC + ' = ' + F_2D3 + '。';
      }
      render();
    });
  });

  document.getElementById('quote-btn').addEventListener('click', function () {
    playing = false;
    var st = computeState();
    var tr = st.traj;
    var msg = '我在应试微课《有界磁场动态圆》第 ' + formatTime(t) + ' 暂停了（' + (st.model === 'scale' ? '放缩圆' : '旋转圆') + '，R=' + tr.R.toFixed(2) + 'd，α=' + Math.round(tr.alphaDeg) + '°，偏转角 ' + Math.round(tr.degSweep) + '°），请帮我核对这一步几何方程。';
    if (window.notara && typeof window.notara.quoteState === 'function') {
      window.notara.quoteState({
        summary: msg,
        params: { timestamp: formatTime(t), model: st.model, R_over_d: Number(tr.R.toFixed(2)), alphaDeg: Math.round(tr.alphaDeg), deflectionDeg: Math.round(tr.degSweep) }
      });
      toastEl.hidden = false;
      toastEl.textContent = '已带入课堂草稿。';
    } else {
      toastEl.hidden = false;
      toastEl.textContent = '已记录当前帧（' + formatTime(t) + '，R=' + tr.R.toFixed(2) + 'd）。';
    }
    render();
  });

  window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
